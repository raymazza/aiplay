<script type="application/json" id="places">[{"id":"t-sensoji","city":"tokyo","n":"Sensō-ji","ja":"浅草寺","cat":"temple","area":"Asakusa","lat":35.71472,"lng":139.79675,"r":3,"best":"any","blurb":"Tokyo's oldest temple, founded in 628. Walk in through the Kaminarimon gate and the Nakamise stalls, then waft the incense smoke over yourself in front of the main hall.","tip":"The main hall is open 6:30 am to 5 pm. After dark the pagoda and gates are lit and the crowds thin out; Asakusa Shrine sits just east of the hall."},{"id":"t-asakusa-tic","city":"tokyo","n":"Asakusa Tourist Center terrace","ja":"浅草文化観光センター","cat":"view","area":"Asakusa","lat":35.71069,"lng":139.7965,"r":2,"best":"any","hrs":[9,22],"blurb":"Kengo Kuma's stacked-roof building across from Kaminarimon has a free 8th-floor terrace looking straight up Nakamise to Sensō-ji, with Skytree off to the east.","tip":"Free, and the terrace stays open into the evening. A good first stop for a paper map and a clean restroom.","sn":"Asakusa terrace"},{"id":"t-hoppy","city":"tokyo","n":"Hoppy-dōri","ja":"ホッピー通り","cat":"food","area":"Asakusa","lat":35.71354,"lng":139.79425,"r":2,"best":"evening","hrs":[12,23],"blurb":"A strip of izakaya with plastic stools out on the street, known for gyū-suji nikomi (slow-simmered beef stew) and Hoppy, a beer-flavored mixer for shōchū.","tip":"Most places open from midday and run late. Shō-chan is closed Mondays and Tuesdays, takes cash only and allows smoking.","order":"Gyū-nikomi (beef-tendon stew) and a Hoppy. Shō-chan, a red-curtained counter open since 1951, has kept its stew pot going for 70-plus years"},{"id":"t-kappabashi","city":"tokyo","n":"Kappabashi Kitchen Town","ja":"かっぱ橋道具街","cat":"streets","area":"Asakusa","lat":35.71444,"lng":139.78889,"r":2,"best":"day","hrs":[10,17],"closed":[0],"soft":true,"blurb":"About 170 restaurant-supply shops selling Japanese knives, ceramics, lacquerware, noren curtains and the plastic food models you see in restaurant windows.","tip":"Many shops close Sundays. Knife shops can engrave a name on the blade while you wait.","in":1,"sn":"Kappabashi"},{"id":"t-imado","city":"tokyo","n":"Imado Shrine","ja":"今戸神社","cat":"shrine","area":"Asakusa","lat":35.71931,"lng":139.80353,"r":3,"best":"day","blurb":"A small shrine that calls itself a birthplace of the maneki-neko beckoning cat. Couples come here to pray for a good match, and the ema prayer plaques are round with a pair of cats on them.","tip":"Usually quiet. Walk up along Sumida Park by the river to get here."},{"id":"t-hanayashiki","city":"tokyo","n":"Hanayashiki","ja":"浅草花やしき","cat":"play","area":"Asakusa","lat":35.71546,"lng":139.79468,"r":2,"best":"day","hrs":[10,18],"blurb":"Japan's oldest amusement park, opened in 1853 and squeezed into a single city block. Its rattly 1953 roller coaster skims past the neighbors' rooftops.","tip":"Tiny and retro. Best as a quick, silly detour. Hours shift by season."},{"id":"t-engei","city":"tokyo","n":"Asakusa Engei Hall","ja":"浅草演芸ホール","cat":"play","area":"Asakusa","lat":35.7135,"lng":139.79303,"r":2,"best":"any","hrs":[11.67,21],"blurb":"A yose variety theater running rakugo storytelling and manzai comedy almost all day, broken up by jugglers, magicians and paper-cutting acts that need no Japanese.","tip":"Walk in mid-show. Seats aren’t cleared between shows, so one ticket can last into the evening (no re-entry).","in":1,"price":"¥3,500; ¥2,500 after 6 pm, ¥2,000 after 7 pm","hrsTxt":"Day show 11:40 am–4:30 pm, night show 4:40–9 pm, every day"},{"id":"t-sumida-walk","city":"tokyo","n":"Sumida River Walk","ja":"すみだリバーウォーク","cat":"view","area":"Asakusa","lat":35.71194,"lng":139.80111,"r":2,"best":"evening","hrs":[7,22],"blurb":"A footpath hung beside the Tobu railway bridge, so trains rattle past as you cross the Sumida. On the far side, Tokyo Mizumachi has cafés and shops in the arches under the tracks.","tip":"Cross at dusk with Skytree lighting up ahead of you. Open 7:00 to 22:00."},{"id":"t-skytree","city":"tokyo","n":"Tokyo Skytree","ja":"東京スカイツリー","cat":"view","area":"Oshiage","lat":35.7101,"lng":139.8107,"r":2,"best":"any","hrs":[10,21],"blurb":"At 634 m, the tallest tower in the world. The decks at 350 m and 450 m look out over the whole Kantō plain.","tip":"On clear mornings you can see Mount Fuji to the southwest. Timed tickets online skip the ticket line.","in":1,"price":"From ¥1,800","hrsTxt":"10 am–10 pm, last entry 9 pm"},{"id":"t-kuramae","city":"tokyo","n":"Kuramae","ja":"蔵前","cat":"streets","area":"Kuramae","lat":35.70319,"lng":139.79071,"r":2,"best":"day","blurb":"Once a row of rice warehouses, now Tokyo's small-maker district: coffee roasters, leather workshops, and Kakimori, where you build a custom notebook and blend your own ink.","tip":"Most shops open late morning, and a few close early in the week.","in":1},{"id":"t-river-cruise","city":"tokyo","n":"Sumida River water bus","ja":"水上バス 浅草乗船場","cat":"view","area":"Asakusa","lat":35.71067,"lng":139.7984,"r":2,"best":"day","hrs":[10,17],"blurb":"Water buses leave from the pier by Azuma-bashi and glide down the Sumida under a dozen bridges to Hama-rikyū Gardens and Odaiba.","tip":"Buy tickets at the pier. A relaxed way to reach Hama-rikyū, about 35 minutes downriver.","in":1,"sn":"Water bus"},{"id":"t-hokusai","city":"tokyo","n":"Sumida Hokusai Museum","ja":"すみだ北斎美術館","cat":"art","area":"Ryōgoku","lat":35.69675,"lng":139.80039,"r":2,"best":"day","hrs":[9.5,17],"closed":[1],"blurb":"Kazuyo Sejima's sliced-aluminum building in the neighborhood where Hokusai was born and worked. The permanent gallery shows high-quality reproductions of the Great Wave and his views of Fuji, with touch screens for zooming into the details.","tip":"Closed Mondays. Ryōgoku around it is sumo country, full of chanko-nabe restaurants.","in":1,"sn":"Hokusai Museum"},{"id":"t-kiyosumi","city":"tokyo","n":"Kiyosumi Garden","ja":"清澄庭園","cat":"garden","area":"Kiyosumi-Shirakawa","lat":35.68113,"lng":139.79717,"r":2,"best":"day","hrs":[9,17],"blurb":"A Meiji-era stroll garden around a big pond, with a line of stepping stones you can hop across and boulders shipped in from all over Japan.","tip":"The streets around Kiyosumi-Shirakawa are full of coffee roasters and small galleries."},{"id":"t-fukagawa","city":"tokyo","n":"Fukagawa Fudō-dō","ja":"深川不動堂","cat":"temple","area":"Monzen-Nakachō","lat":35.67292,"lng":139.79833,"r":2,"best":"day","hrs":[8,17.5],"blurb":"A temple wrapped in Sanskrit script. Monks perform the goma fire ritual with pounding taiko drums several times a day, and one hall holds some 10,000 small crystal Fudō statues.","tip":"Fire rituals run at set times through the day, starting at 9:00. Check the board at the gate.","in":1},{"id":"t-ueno-park","city":"tokyo","n":"Ueno Park & Shinobazu Pond","ja":"上野恩賜公園","cat":"garden","area":"Ueno","lat":35.71222,"lng":139.77111,"r":2,"best":"any","blurb":"Tokyo's big museum park, with shrines, a five-story pagoda and Shinobazu Pond, where lotus leaves cover the water and a causeway leads to the octagonal Bentendō hall.","tip":"Rent a swan boat on the pond, or cut through to Ameyoko for street food.","sn":"Ueno Park"},{"id":"t-tnm","city":"tokyo","n":"Tokyo National Museum","ja":"東京国立博物館","cat":"art","area":"Ueno","lat":35.7189,"lng":139.7764,"r":2,"best":"day","hrs":[9.5,16.5],"closed":[1],"blurb":"The country's largest collection of Japanese art: samurai armor, swords, ukiyo-e and Buddhist sculpture. The Gallery of Hōryū-ji Treasures is a calm, dark hall of 7th-century bronzes.","tip":"The autumn special exhibition (¥2,300) shows treasures of Kyoto’s Daitoku-ji, a good preview before Kyoto. Two hours covers the main Honkan building.","in":1,"sn":"Tokyo Natl. Museum","hx":{"5":[9.5,19.5],"6":[9.5,19.5]},"ev":[{"from":"2026-10-22","to":"2026-10-22","h":[17.5,19],"end":19.5,"t":"ZEN NIGHT in the garden","short":"Zen Night","note":"Ticketed sound-and-light evening in the museum garden, ¥4,200 at the door (includes the Daitoku-ji exhibition)"},{"from":"2026-10-23","to":"2026-10-24","h":[17.5,20.5],"end":21,"t":"ZEN NIGHT in the garden","short":"Zen Night","note":"Ticketed sound-and-light evening in the museum garden, ¥4,200 at the door (includes the Daitoku-ji exhibition)"}],"price":"¥1,000; special exhibitions extra","hrsTxt":"9:30 am–5 pm, Fridays and Saturdays to 8 pm; closed Mondays. Last entry 30 min before closing"},{"id":"t-ameyoko","city":"tokyo","n":"Ameyoko","ja":"アメ横","cat":"food","area":"Ueno","lat":35.71031,"lng":139.77456,"r":1,"best":"afternoon","hrs":[10,20],"blurb":"A loud market street under the JR tracks between Ueno and Okachimachi, born as a postwar black market: dried fish, spices, fruit on sticks and standing bars.","tip":"Late afternoon is liveliest. Carry cash for the food stalls."},{"id":"t-yanaka-ginza","city":"tokyo","n":"Yanaka Ginza","ja":"谷中銀座","cat":"streets","area":"Yanaka","lat":35.72771,"lng":139.76541,"r":3,"best":"day","hrs":[10,18],"blurb":"A shopping street of family-run shops in one of the few districts that survived the 1923 earthquake and the wartime bombing. Snack on menchi-katsu and watch for the neighborhood's cats.","tip":"Come down the Yūyake Dandan steps at the top of the street around sunset."},{"id":"t-yanaka-cemetery","city":"tokyo","n":"Yanaka temple lanes","ja":"谷中霊園","cat":"streets","area":"Yanaka","lat":35.72528,"lng":139.77056,"r":2,"best":"day","blurb":"A tree-lined cemetery and the backstreets around it, where dozens of small temples, old wooden houses and craft shops make one of Tokyo's quietest walks.","tip":"Walk from Nippori Station's west exit through the cemetery to Yanaka Ginza.","sn":"Yanaka lanes"},{"id":"t-nezu","city":"tokyo","n":"Nezu Shrine","ja":"根津神社","cat":"shrine","area":"Nezu","lat":35.72028,"lng":139.76083,"r":2,"best":"morning","blurb":"One of Tokyo's oldest shrines, with lacquered Edo-period buildings and a winding tunnel of small vermilion torii, like a pocket-sized Fushimi Inari.","tip":"Go early in the morning to have the torii path to yourselves.","hrs":[6.5,17]},{"id":"t-kanda-myojin","city":"tokyo","n":"Kanda Myōjin","ja":"神田明神","cat":"shrine","area":"Akihabara","lat":35.70194,"lng":139.76778,"r":2,"best":"any","blurb":"A 1,300-year-old shrine that now watches over Akihabara. You can buy charms that protect your devices, and anime characters turn up on the prayer plaques.","tip":"Yushima Seidō, a black-lacquered Confucian temple, is a two-minute walk down the hill."},{"id":"t-super-potato","city":"tokyo","n":"Super Potato","ja":"スーパーポテト秋葉原店","cat":"play","area":"Akihabara","lat":35.69938,"lng":139.77073,"r":2,"best":"day","hrs":[11,20],"blurb":"Three floors of retro consoles, cartridges and accessories from Famicom to PlayStation, plus a top floor of old arcade cabinets you can still play.","tip":"Collector prices, but browsing is free. Mandarake Complex nearby is eight floors of manga and figures.","in":1},{"id":"t-jimbocho","city":"tokyo","n":"Jimbōchō Book Town","ja":"神保町古書店街","cat":"streets","area":"Kanda","lat":35.6959,"lng":139.7577,"r":2,"best":"day","hrs":[10,18],"blurb":"Around 130 secondhand bookshops along Yasukuni-dōri, from Edo-period woodblock books to art catalogs and vintage manga. Ohya Shobō sells antique maps and prints.","tip":"Curry is the neighborhood lunch. The open-air book fair runs Oct 23 to Nov 1 this year.","in":1,"ev":[{"from":"2026-10-24","to":"2026-10-25","h":[10,18],"t":"Jimbōchō Book Festival","short":"book festival","note":"Publishers’ stalls on Suzuran-dōri and Sakura-dōri on top of the used-book fair; called off if it rains"},{"from":"2026-10-23","to":"2026-11-01","h":[10,18],"t":"Kanda Used Book Festival","short":"book fair","note":"Open-air stalls along Yasukuni-dōri"}]},{"id":"t-koishikawa","city":"tokyo","n":"Koishikawa Kōrakuen","ja":"小石川後楽園","cat":"garden","area":"Bunkyō","lat":35.70556,"lng":139.74917,"r":2,"best":"day","hrs":[9,17],"blurb":"One of Tokyo's oldest gardens, laid out in the 1600s, with a full-moon bridge and miniature versions of famous Chinese and Japanese landscapes, right beside Tokyo Dome.","tip":"Quieter than the big-name gardens and an easy stop on the way to Kagurazaka."},{"id":"t-rikugien","city":"tokyo","n":"Rikugien","ja":"六義園","cat":"garden","area":"Komagome","lat":35.73306,"lng":139.74667,"r":2,"best":"day","hrs":[9,17],"blurb":"A stroll garden from 1702 that recreates 88 scenes from classical waka poetry around a central pond, with a teahouse serving matcha.","tip":"The Somei gate is closest to Komagome Station."},{"id":"t-kagurazaka","city":"tokyo","n":"Kagurazaka","ja":"神楽坂","cat":"streets","area":"Kagurazaka","lat":35.70181,"lng":139.73964,"r":3,"best":"evening","blurb":"An old geisha district on a hill. Turn off the main slope into Hyōgo Yokochō and the other stone-paved alleys, lined with black-wood ryōtei and tiny restaurants.","tip":"Best around dusk when the lanterns come on. It's also Tokyo's French quarter, with bistros and bakeries."},{"id":"t-east-gardens","city":"tokyo","n":"Imperial Palace East Gardens","ja":"皇居東御苑","cat":"garden","area":"Marunouchi","lat":35.6875,"lng":139.7575,"r":2,"best":"day","hrs":[9,16],"closed":[1,5],"blurb":"Free gardens on the site of Edo Castle's inner keep. You can climb the massive stone base of the old castle tower and walk along the original walls.","tip":"Closed Mondays and Fridays (including Oct 23). Free; take a token at the gate and hand it back when you leave.","sn":"Palace East Gardens","hrsTxt":"9 am–4:30 pm, last entry 4 pm; closed Mon and Fri"},{"id":"t-tokyo-station","city":"tokyo","n":"Tokyo Station & KITTE garden","ja":"東京駅丸の内駅舎","cat":"view","area":"Marunouchi","lat":35.68126,"lng":139.76622,"r":1,"best":"any","blurb":"The red-brick Marunouchi building from 1914, restored with its domed halls. The free rooftop garden on KITTE's 6th floor looks down on the station and the tracks.","tip":"Character Street in the basement has shops for Pokémon, Ghibli and Shōnen Jump.","in":1,"sn":"Tokyo Station"},{"id":"t-ginza","city":"tokyo","n":"Ginza","ja":"銀座","cat":"streets","area":"Ginza","lat":35.67124,"lng":139.76503,"r":1,"best":"day","blurb":"Department stores, flagship boutiques and Itoya's twelve floors of stationery. On weekend afternoons Chūō-dōri closes to cars and becomes a promenade.","tip":"Ginza Six has a free rooftop garden above the crowds.","in":1,"ev":[{"dow":[6,0],"h":[12,17],"t":"Car-free Chūō-dōri","short":"car-free","note":"Pedestrian paradise on weekend afternoons"}]},{"id":"t-tsukiji","city":"tokyo","n":"Tsukiji Outer Market","ja":"築地場外市場","cat":"food","area":"Tsukiji","lat":35.66546,"lng":139.77028,"r":3,"best":"morning","hrs":[6,14],"closed":[0,3],"soft":true,"blurb":"The wholesale fish market moved to Toyosu, but the outer market's stalls and counters stayed: tamagoyaki on a stick, oysters, sushi for breakfast and knife shops.","tip":"Go between 7 and 10 am. Many shops close Sundays, Wednesdays and holidays.","sn":"Tsukiji Market"},{"id":"t-hamarikyu","city":"tokyo","n":"Hama-rikyū Gardens","ja":"浜離宮恩賜庭園","cat":"garden","area":"Shiodome","lat":35.66,"lng":139.762,"r":2,"best":"day","hrs":[9,16.5],"blurb":"A shōgun's former duck-hunting garden on Tokyo Bay, with a tidal pond fed by seawater and skyscrapers rising behind the pines.","tip":"Have matcha and a sweet at the Nakajima teahouse over the pond. The water bus from Asakusa stops here.","price":"¥300","hrsTxt":"9 am–5 pm, last entry 4:30 pm"},{"id":"t-tsukishima","city":"tokyo","n":"Tsukishima Monja Street","ja":"月島もんじゃストリート","cat":"food","area":"Tsukishima","lat":35.66342,"lng":139.78268,"r":2,"best":"dinner","hrs":[11,22],"blurb":"Dozens of restaurants serving monjayaki, Tokyo's runny cousin of okonomiyaki, which you cook on the table grill and eat straight off it with tiny spatulas.","tip":"Staff will usually make the first one for you. Mentai-mochi-cheese is the classic order.","in":1,"sn":"Monja Street"},{"id":"t-atago","city":"tokyo","n":"Atago Shrine","ja":"愛宕神社","cat":"shrine","area":"Toranomon","lat":35.66477,"lng":139.74842,"r":2,"best":"day","blurb":"On top of Tokyo's highest natural hill, reached by 86 very steep stone steps, the 'Stairs of Success'. Legend says a samurai rode his horse up them in 1634.","tip":"A peaceful pocket of carp ponds among the Toranomon towers."},{"id":"t-zojoji","city":"tokyo","n":"Zōjō-ji","ja":"増上寺","cat":"temple","area":"Shiba","lat":35.65743,"lng":139.74833,"r":2,"best":"any","blurb":"The Tokugawa family temple, with Tokyo Tower rising right behind its main hall. Rows of small Jizō statues in red caps and bibs, with spinning pinwheels, honor children.","tip":"Frame the 1622 Sangedatsumon gate with the tower behind it. Both are lit at night."},{"id":"t-borderless","city":"tokyo","n":"teamLab Borderless","ja":"チームラボボーダレス","cat":"art","area":"Azabudai Hills","lat":35.66056,"lng":139.74028,"r":3,"best":"any","hrs":[10,20],"blurb":"A maze of dark rooms where generative digital artworks drift between spaces and respond to you, including the Bubble Universe of light spheres and a tea house where flowers bloom in your cup.","tip":"Book a timed ticket online ahead. Allow two to three hours.","in":1,"sn":"teamLab Borderless"},{"id":"t-roppongi","city":"tokyo","n":"Mori Art Museum","ja":"森美術館","cat":"art","area":"Roppongi","lat":35.66056,"lng":139.72917,"r":2,"best":"evening","hrs":[10,21.5],"blurb":"Contemporary art shows on the 53rd floor of Roppongi Hills, paired with the Tokyo City View observation deck. Open late most nights.","tip":"Louise Bourgeois's giant spider sculpture, Maman, stands at the foot of the tower.","in":1},{"id":"t-sengakuji","city":"tokyo","n":"Sengaku-ji","ja":"泉岳寺","cat":"temple","area":"Takanawa","lat":35.63772,"lng":139.7363,"r":1,"best":"day","blurb":"Burial place of the 47 rōnin, whose revenge in 1703 became Japan's most retold samurai story. Visitors still leave incense at each of their graves.","tip":"A small museum shows the rōnin's belongings. Two minutes from Sengakuji Station."},{"id":"t-planets","city":"tokyo","n":"teamLab Planets","ja":"チームラボプラネッツ","cat":"art","area":"Toyosu","lat":35.64908,"lng":139.78953,"r":3,"best":"any","hrs":[9,21],"blurb":"You walk barefoot through knee-deep water where projected koi swim around your legs, then lie back under a dome of drifting flowers. More physical than Borderless.","tip":"Timed tickets online. Wear pants that roll up above the knee. The exhibition is scheduled to run through 2027.","in":1},{"id":"t-odaiba","city":"tokyo","n":"Odaiba Seaside","ja":"お台場海浜公園","cat":"view","area":"Odaiba","lat":35.6299,"lng":139.77878,"r":1,"best":"evening","blurb":"Man-made islands in Tokyo Bay with a sandy beach (no swimming) facing Rainbow Bridge and the skyline, plus a small replica of the Statue of Liberty.","tip":"Ride the driverless Yurikamome line in the front car across Rainbow Bridge, then stay for the bridge lights after dark."},{"id":"t-meiji","city":"tokyo","n":"Meiji Jingū","ja":"明治神宮","cat":"shrine","area":"Harajuku","lat":35.67611,"lng":139.69917,"r":3,"best":"morning","hrs":[5.67,16.67],"blurb":"A shrine to Emperor Meiji in a forest grown from about 100,000 donated trees, entered under a 12 m torii made from 1,500-year-old cypress. Weddings often process through on weekends.","tip":"Gates open at sunrise and close at sunset. Enter from Harajuku and leave toward Yoyogi to see the whole forest.","hrsTxt":"5:40 am–4:40 pm in October (the gates follow sunrise and sunset)"},{"id":"t-harajuku","city":"tokyo","n":"Harajuku & Cat Street","ja":"竹下通り・キャットストリート","cat":"streets","area":"Harajuku","lat":35.67128,"lng":139.70491,"r":1,"best":"day","blurb":"Takeshita-dōri is crêpes, kawaii fashion and crowds. Cross Omotesandō to Cat Street for calmer vintage shops and independent brands.","tip":"Omotesandō doubles as an architecture walk: Tod's by Toyo Ito, Prada by Herzog & de Meuron, Dior by SANAA.","sn":"Harajuku"},{"id":"t-nezu-museum","city":"tokyo","n":"Nezu Museum","ja":"根津美術館","cat":"art","area":"Aoyama","lat":35.66215,"lng":139.71703,"r":2,"best":"day","hrs":[10,16.5],"closed":[1],"blurb":"Kengo Kuma's museum of Japanese and East Asian art, entered along a bamboo-lined walk. Behind it, a sloping garden of stone lanterns, teahouses and ponds.","tip":"Book a timed entry online. Closed Mondays.","in":1},{"id":"t-shibuya-crossing","city":"tokyo","n":"Shibuya Crossing","ja":"渋谷スクランブル交差点","cat":"view","area":"Shibuya","lat":35.6595,"lng":139.70056,"r":2,"best":"evening","blurb":"The famous scramble, where up to 3,000 people cross at once when every light turns red for cars. The Hachikō statue is by the station exit.","tip":"The walkway into Shibuya Mark City has a free view down onto the crossing."},{"id":"t-nonbei","city":"tokyo","n":"Nonbei Yokochō","ja":"のんべい横丁","cat":"food","area":"Shibuya","lat":35.66005,"lng":139.70145,"r":2,"best":"evening","hrs":[18,24],"blurb":"'Drunkard's Alley': two narrow lanes of postwar bars beside the Yamanote tracks, most with five to eight seats.","tip":"Evenings only. Some bars charge a seat fee; the ones with English menus posted outside welcome visitors.","in":1},{"id":"t-shibuya-sky","city":"tokyo","n":"Shibuya Sky","ja":"渋谷スカイ","cat":"view","area":"Shibuya","lat":35.65846,"lng":139.70226,"r":2,"best":"evening","hrs":[10,21.33],"blurb":"An open-air rooftop about 230 m up on Shibuya Scramble Square, with glass walls, hammocks and the crossing far below.","tip":"Sunset slots sell out days ahead, so book online. Bags go in lockers before the roof.","hrsTxt":"10 am–10:30 pm, last entry 9:20 pm","price":"From ¥2,700 online"},{"id":"t-nintendo","city":"tokyo","n":"Nintendo Tokyo","ja":"ニンテンドートウキョー","cat":"play","area":"Shibuya Parco","lat":35.66221,"lng":139.6992,"r":3,"best":"day","hrs":[10,21],"blurb":"Nintendo's official store on Shibuya Parco's 6th floor, with exclusive merchandise. The Pokémon Center and the Capcom Store share the floor.","tip":"Weekday mornings are calmest. Parco's basement food floor is good for lunch.","in":1},{"id":"t-shimokita","city":"tokyo","n":"Shimokitazawa","ja":"下北沢","cat":"streets","area":"Shimokitazawa","lat":35.66139,"lng":139.6675,"r":2,"best":"evening","blurb":"A low-rise maze of vintage clothing, record stores, small theaters and live music venues. Reload and Bonus Track, built along the old rail line, add bookshops and cafés.","tip":"Shops open late morning and the neighborhood gets going in the evening."},{"id":"t-nakameguro","city":"tokyo","n":"Nakameguro","ja":"中目黒","cat":"streets","area":"Nakameguro","lat":35.64424,"lng":139.69922,"r":1,"best":"evening","blurb":"Boutiques and cafés along the Meguro River canal, plus the four-story Starbucks Reserve Roastery designed by Kengo Kuma.","tip":"Walk the river path from the station; evenings here feel local and relaxed."},{"id":"t-gotokuji","city":"tokyo","n":"Gōtoku-ji","ja":"豪徳寺","cat":"temple","area":"Setagaya","lat":35.64878,"lng":139.64742,"r":3,"best":"day","hrs":[6,17],"blurb":"A Zen temple that claims to be the origin of the maneki-neko. Thousands of white beckoning-cat figurines crowd the shelves beside a small hall, left by people whose wishes came true.","tip":"Ride the little Setagaya Line tram from Sangenjaya to Miyanosaka, a short walk away."},{"id":"t-shinjuku-gyoen","city":"tokyo","n":"Shinjuku Gyoen","ja":"新宿御苑","cat":"garden","area":"Shinjuku","lat":35.685,"lng":139.71,"r":2,"best":"day","hrs":[9,16],"closed":[1],"blurb":"A former imperial garden mixing French formal, English landscape and Japanese styles, with a big glass greenhouse. A chrysanthemum show and fall color arrive in November.","tip":"Closed Mondays, and it closes around 4 pm this time of year. Picnics are welcome.","price":"¥500","hrsTxt":"9 am–4:30 pm, last entry 4 pm; closed Mon"},{"id":"t-omoide","city":"tokyo","n":"Omoide Yokochō","ja":"思い出横丁","cat":"food","area":"Shinjuku","lat":35.69308,"lng":139.6995,"r":2,"best":"evening","hrs":[16,24],"blurb":"Smoky lanes of tiny yakitori counters by Shinjuku Station's west exit, little changed in feel since the 1940s.","tip":"Most counters seat fewer than ten. Many open in the late afternoon.","in":1},{"id":"t-golden-gai","city":"tokyo","n":"Golden Gai","ja":"新宿ゴールデン街","cat":"food","area":"Shinjuku","lat":35.69383,"lng":139.70496,"r":2,"best":"evening","hrs":[19,26],"blurb":"Six alleys packed with about 200 bars, each the size of a closet with its own theme and regulars. Hanazono Shrine is right next door.","tip":"Expect a cover charge of ¥500 to ¥1,500. Bars that welcome visitors post signs in English.","in":1},{"id":"t-tmg","city":"tokyo","n":"Tokyo Gov't Building","ja":"東京都庁","cat":"view","area":"Shinjuku","lat":35.68972,"lng":139.69222,"r":2,"best":"evening","hrs":[9.5,21.5],"blurb":"A free observation deck 202 m up Kenzō Tange's twin-tower city hall. After dark, a projection-mapping show plays across the building's face.","tip":"Free entry; the north and south decks take turns opening. On clear days you can see Mount Fuji to the west.","in":1,"sn":"Gov’t Bldg deck","hrsTxt":"South deck 9:30 am–10 pm (last entry 9:30); North deck to 5:30 pm","price":"Free"},{"id":"t-nakano","city":"tokyo","n":"Nakano Broadway","ja":"中野ブロードウェイ","cat":"play","area":"Nakano","lat":35.70917,"lng":139.66556,"r":2,"best":"day","hrs":[12,20],"blurb":"A 1966 shopping arcade whose upper floors became a warren of collector shops: vintage toys, retro games, manga, watches and the original Mandarake.","tip":"Most shops open around noon. Head straight up to floors 2 to 4.","in":1},{"id":"t-kichijoji","city":"tokyo","n":"Inokashira Park","ja":"井の頭恩賜公園","cat":"garden","area":"Kichijōji","lat":35.70083,"lng":139.57417,"r":2,"best":"day","blurb":"A wooded park around a long pond with swan boats, with the Ghibli Museum at its southern edge. Kichijōji has the tiny bars of Harmonica Yokochō and plenty of cafés.","tip":"Ghibli Museum tickets sell out weeks ahead and are sold online only."},{"id":"t-shibamata","city":"tokyo","n":"Shibamata Taishakuten","ja":"柴又帝釈天","cat":"temple","area":"Shibamata","lat":35.75833,"lng":139.87833,"r":2,"best":"day","hrs":[9,16],"blurb":"A Shōwa-era temple town made famous by Tora-san, the hero of 50 comedy films. The temple's outer walls are covered in astonishingly detailed wood carvings.","tip":"Try kusa-dango on the approach street, then cross the Edogawa on the Yagiri no Watashi rowboat ferry.","sn":"Shibamata"},{"id":"t-ningyocho","city":"tokyo","n":"Amazake Yokochō","ja":"甘酒横丁","cat":"streets","area":"Ningyōchō","lat":35.68618,"lng":139.78505,"r":1,"best":"day","blurb":"A lane of old family shops in Ningyōchō: tofu makers, rice crackers, taiyaki and wooden hagoita paddles.","tip":"Try amazake, the sweet fermented rice drink the lane is named after."},{"id":"k-kiyomizu","city":"kyoto","n":"Kiyomizu-dera","ja":"清水寺","cat":"temple","area":"Higashiyama","lat":34.995,"lng":135.785,"r":3,"best":"morning","hrs":[6,18],"blurb":"A hillside temple whose huge wooden stage juts out over the treetops, built without nails. Below it, you can drink from the three streams of the Otowa waterfall.","tip":"Go at the 6:00 opening, before the tour groups arrive."},{"id":"k-sannenzaka","city":"kyoto","n":"Sannenzaka & Ninenzaka","ja":"三年坂・二年坂","cat":"streets","area":"Higashiyama","lat":34.99647,"lng":135.78093,"r":3,"best":"morning","blurb":"Stone-paved slopes lined with wooden machiya shops, teahouses and pottery stores, leading up toward Kiyomizu-dera.","tip":"Legend says a stumble on Sannenzaka brings three years' bad luck. Nearly empty before 8 am.","sn":"Sannenzaka"},{"id":"k-yasaka-pagoda","city":"kyoto","n":"Yasaka Pagoda & Kōshin-dō","ja":"八坂の塔","cat":"temple","area":"Higashiyama","lat":34.99855,"lng":135.77925,"r":2,"best":"morning","blurb":"The five-story Hōkan-ji pagoda rises over a sloping lane of old houses. Just below, Yasaka Kōshin-dō is hung with bright cloth kukurizaru, 'bound monkey' charms.","tip":"Write a wish on a kukurizaru and hang it up. Tradition says you give up one desire in return.","sn":"Yasaka Pagoda"},{"id":"k-ishibe","city":"kyoto","n":"Ishibe-kōji","ja":"石塀小路","cat":"streets","area":"Higashiyama","lat":35.001,"lng":135.7795,"r":3,"best":"evening","blurb":"A hushed, winding alley of stone walls and stone paving between Kōdai-ji and Yasaka Shrine, lined with ryokan and restaurants hidden behind bamboo screens.","tip":"Best at dusk when the lanterns are lit. Keep voices low; people live here."},{"id":"k-kodaiji","city":"kyoto","n":"Kōdai-ji & Nene-no-michi","ja":"高台寺・ねねの道","cat":"temple","area":"Higashiyama","lat":35.00076,"lng":135.78111,"r":2,"best":"any","hrs":[9,17],"blurb":"Founded by the widow of Toyotomi Hideyoshi, with a raked garden, a bamboo grove and lacquered halls. Nene-no-michi, the stone path below it, is one of Higashiyama's calmest walks.","tip":"The combo ticket adds Entoku-in, a sub-temple on Nene-no-michi with its own night viewing. There’s no re-entry once you leave.","sn":"Kōdai-ji","ev":[{"from":"2026-10-23","to":"2026-12-13","h":[17,21.5],"end":22,"t":"Autumn night viewing","short":"lit tonight","note":"Lights come on at 5 pm; the day ticket stays valid, last entry 9:30 pm"}],"price":"¥800; ¥1,200 with Entoku-in","hrsTxt":"9 am–10 pm during the light-up, last entry 9:30 pm"},{"id":"k-yasaka-shrine","city":"kyoto","n":"Yasaka Shrine","ja":"八坂神社","cat":"shrine","area":"Gion","lat":35.00361,"lng":135.77861,"r":2,"best":"evening","blurb":"The vermilion gate at the top of Shijō-dōri marks Gion's guardian shrine, home of the Gion Matsuri. Its dance stage is ringed with hundreds of paper lanterns.","tip":"Open around the clock. The lanterns glow at night, making it a good last stop after dinner in Gion."},{"id":"k-maruyama","city":"kyoto","n":"Maruyama Park","ja":"円山公園","cat":"garden","area":"Gion","lat":35.00333,"lng":135.78139,"r":1,"best":"day","blurb":"Kyoto's oldest public park, behind Yasaka Shrine, with a pond, stone bridges and a famous weeping cherry. It links Gion with Chion-in and Kōdai-ji.","tip":"The easy shortcut between Yasaka Shrine and the Nene-no-michi path."},{"id":"k-chionin","city":"kyoto","n":"Chion-in","ja":"知恩院","cat":"temple","area":"Higashiyama","lat":35.00521,"lng":135.7834,"r":2,"best":"day","hrs":[6,16],"blurb":"Head temple of the Jōdo sect, entered through the Sanmon, the largest wooden temple gate in Japan. Its 70-ton bell takes 17 monks to ring on New Year's Eve.","tip":"Climb the steep 'man's stairs' up through the gate, or take the gentler slope beside them."},{"id":"k-shorenin","city":"kyoto","n":"Shōren-in","ja":"青蓮院","cat":"temple","area":"Higashiyama","lat":35.00731,"lng":135.7832,"r":2,"best":"day","hrs":[9,17],"blurb":"A quiet imperial temple shaded by giant camphor trees, with tatami rooms that open onto a pond garden. Far fewer visitors than its famous neighbors.","tip":"Sit on the veranda for a while. A re-roofing project that began in 2025 may put some buildings under wraps.","in":1},{"id":"k-shirakawa","city":"kyoto","n":"Gion Shirakawa","ja":"祇園白川","cat":"streets","area":"Gion","lat":35.0057,"lng":135.7748,"r":3,"best":"evening","blurb":"Willows trail over a shallow canal lined with latticed teahouses. Tatsumi Bridge and its small shrine are the classic Gion view.","tip":"Lovely after dark. Don't photograph maiko or geiko up close; it's banned on Gion's private lanes."},{"id":"k-hanamikoji","city":"kyoto","n":"Hanamikōji","ja":"花見小路","cat":"streets","area":"Gion","lat":35.00238,"lng":135.77526,"r":2,"best":"evening","blurb":"Gion's main lane of ochaya teahouses and restaurants, running south from Shijō-dōri to Kennin-ji.","tip":"The side alleys are private roads with no-photo signs and fines. Take pictures on Hanamikōji itself."},{"id":"k-kenninji","city":"kyoto","n":"Kennin-ji","ja":"建仁寺","cat":"temple","area":"Gion","lat":35.00099,"lng":135.77366,"r":2,"best":"day","hrs":[10,17],"blurb":"Kyoto's oldest Zen temple, from 1202. Inside: a ceiling painting of twin dragons, a replica of Sōtatsu's Wind God and Thunder God screens, and a circle-triangle-square garden.","tip":"Quiet and spacious even when Gion is packed. Sit on the veranda over the raked gravel.","in":1},{"id":"k-yasui","city":"kyoto","n":"Yasui Konpira-gū","ja":"安井金比羅宮","cat":"shrine","area":"Gion","lat":34.99992,"lng":135.77578,"r":2,"best":"any","blurb":"A shrine for cutting bad ties and forming good ones. You crawl through a hole in a big stone covered in white paper slips: one way to cut, the other way to bind.","tip":"Crawl through back-to-front together to bind. The shrine's small Ema-kan museum is being rebuilt into 2027."},{"id":"k-rokuhara","city":"kyoto","n":"Rokuharamitsu-ji","ja":"六波羅蜜寺","cat":"temple","area":"Higashiyama","lat":34.9971,"lng":135.77331,"r":3,"best":"day","hrs":[8,17],"blurb":"Its treasure hall holds a 13th-century statue of the monk Kūya with six tiny Buddhas emerging from his mouth, one for each syllable of the chant Na-mu-a-mi-da-butsu.","tip":"Nearby Rokudō Chinnō-ji marks a legendary crossing to the underworld, and a tiny old shop sells 'ghost candy' from a local legend.","in":1},{"id":"k-pontocho","city":"kyoto","n":"Pontochō","ja":"先斗町","cat":"food","area":"Kawaramachi","lat":35.00637,"lng":135.77111,"r":3,"best":"dinner","blurb":"A lantern-lit alley barely two people wide, squeezed between Kiyamachi and the Kamo River and lined with restaurants, bars and teahouses.","tip":"Book dinner ahead. The plover crest on the lanterns is Pontochō's emblem.","in":1},{"id":"k-kamogawa","city":"kyoto","n":"Kamo River banks","ja":"鴨川","cat":"garden","area":"Downtown","lat":35.009,"lng":135.77165,"r":2,"best":"evening","blurb":"Kyoto's living room: grassy banks and paths along the river through the middle of the city. At dusk, couples famously sit at perfectly even intervals along the bank.","tip":"Walk the west bank from Sanjō to Shijō, or north to the Demachiyanagi delta.","sn":"Kamo River"},{"id":"k-nishiki","city":"kyoto","n":"Nishiki Market","ja":"錦市場","cat":"food","area":"Downtown","lat":35.005,"lng":135.765,"r":2,"best":"lunch","hrs":[10,17],"closed":[3],"soft":true,"blurb":"'Kyoto's kitchen': a narrow covered arcade of more than 100 stalls selling pickles, dashimaki omelet, yuba and sweets. The knife maker Aritsugu has been here since 1560.","tip":"Most stalls close by 5 or 6 pm and some close Wednesdays. Eat at the stall rather than while walking.","in":1},{"id":"k-rokkakudo","city":"kyoto","n":"Rokkaku-dō","ja":"六角堂","cat":"temple","area":"Downtown","lat":35.00766,"lng":135.76024,"r":1,"best":"day","hrs":[6,17],"blurb":"A hexagonal temple tucked among office buildings, said to be the birthplace of ikebana. White swans glide in its little pond.","tip":"Find the 'navel stone' in the courtyard, once said to mark the center of Kyoto."},{"id":"k-sanjusangendo","city":"kyoto","n":"Sanjūsangen-dō","ja":"三十三間堂","cat":"temple","area":"Higashiyama","lat":34.98775,"lng":135.77188,"r":3,"best":"day","hrs":[8.5,16.5],"blurb":"A 120-meter hall holding 1,001 life-size statues of the thousand-armed Kannon, row after gleaming row, guarded by 28 deities and the Wind and Thunder Gods.","tip":"Legend says you'll find a face like someone you love among them. No photos inside.","in":1,"sn":"Sanjūsangen-dō","price":"¥600","hrsTxt":"8:30 am–5 pm, last entry 4:30 pm"},{"id":"k-tofukuji","city":"kyoto","n":"Tōfuku-ji","ja":"東福寺","cat":"temple","area":"Higashiyama","lat":34.97705,"lng":135.77409,"r":2,"best":"day","hrs":[9,16.5],"blurb":"A great Zen complex known for Tsūten-kyō, a covered bridge over a valley of maples, and Mirei Shigemori's 1939 checkerboard moss gardens around the abbot's hall.","tip":"The maples usually peak in mid to late November and draw huge crowds. Before then the gardens are calm."},{"id":"k-fushimi-inari","city":"kyoto","n":"Fushimi Inari Taisha","ja":"伏見稲荷大社","cat":"shrine","area":"Fushimi","lat":34.96722,"lng":135.77278,"r":3,"best":"morning","blurb":"Thousands of vermilion torii form tunnels up the slopes of Mount Inari. The full loop to the summit takes two to three hours; most people turn back at the Yotsutsuji viewpoint.","tip":"Open around the clock, so go at dawn or after dark for empty gates. The foxes hold granary keys in their mouths.","sn":"Fushimi Inari"},{"id":"k-heian","city":"kyoto","n":"Heian Jingū","ja":"平安神宮","cat":"shrine","area":"Okazaki","lat":35.01674,"lng":135.78235,"r":1,"best":"day","hrs":[6,17],"blurb":"A scaled-down replica of the original Heian palace, built in 1895 behind a 24-meter torii. The stroll garden behind it has a covered bridge across a pond.","tip":"The shrine courtyard is free; the garden charges admission."},{"id":"k-nanzenji","city":"kyoto","n":"Nanzen-ji","ja":"南禅寺","cat":"temple","area":"Okazaki","lat":35.01198,"lng":135.79439,"r":3,"best":"day","hrs":[8.67,16.67],"blurb":"A major Zen temple with a towering Sanmon gate you can climb for city views, and a red-brick Meiji-era aqueduct arching through its grounds like a Roman ruin.","tip":"Follow the aqueduct uphill to the canal and the start of the Philosopher's Path.","hx":{"0":[8.67,16.92],"6":[8.67,16.92]},"ev":[{"from":"2026-10-25","to":"2026-10-25","h":[6,7],"t":"Dawn zazen","short":"zazen 6 am","note":"Open sitting meditation at Ryūen-kaku, about an hour; arrive 10 minutes early"}],"price":"Hōjō garden ¥600; Sanmon gate ¥600","hrsTxt":"8:40 am–5 pm (weekends to 5:15), last entry 20 min before"},{"id":"k-eikando","city":"kyoto","n":"Eikan-dō","ja":"永観堂","cat":"temple","area":"Okazaki","lat":35.01453,"lng":135.79529,"r":2,"best":"day","hrs":[9,16],"blurb":"Hillside halls linked by covered walkways, home of the Mikaeri Amida, a Buddha statue glancing back over its shoulder.","tip":"Its maple light-ups start Nov 20, so late October is the quiet season. Climb the covered stairs to the Tahōtō pagoda for the view.","price":"¥1,000","hrsTxt":"9 am–5 pm, last entry 4 pm"},{"id":"k-philosophers","city":"kyoto","n":"Philosopher's Path","ja":"哲学の道","cat":"streets","area":"Sakyō","lat":35.022,"lng":135.796,"r":3,"best":"morning","blurb":"A 2 km stone path along a cherry-lined canal, named for the philosopher Kitarō Nishida, who walked it daily in thought. It runs between Nanzen-ji and Ginkaku-ji.","tip":"Start at the Ginkaku-ji end in the morning and walk south, turning off for Hōnen-in."},{"id":"k-honenin","city":"kyoto","n":"Hōnen-in","ja":"法然院","cat":"temple","area":"Sakyō","lat":35.0221,"lng":135.79718,"r":3,"best":"morning","blurb":"A mossy thatched gate opens onto two mounds of raked sand, redrawn with seasonal patterns. A quiet, wooded temple just off the Philosopher's Path.","tip":"The grounds are free (about 6:00 to 16:00). The novelist Jun'ichirō Tanizaki is buried in the cemetery.","hrs":[6,16]},{"id":"k-ginkakuji","city":"kyoto","n":"Ginkaku-ji","ja":"銀閣寺","cat":"temple","area":"Sakyō","lat":35.02667,"lng":135.79833,"r":2,"best":"day","hrs":[8.5,17],"blurb":"The Silver Pavilion was never silvered. Its fame is the dry garden: a sea of raked sand and a flat-topped sand cone said to catch the moonlight.","tip":"Take the hillside path behind the pavilion for a view over the garden and the city.","price":"¥1,000","hrsTxt":"8:30 am–5 pm"},{"id":"k-shimogamo","city":"kyoto","n":"Shimogamo Shrine","ja":"下鴨神社","cat":"shrine","area":"Sakyō","lat":35.03889,"lng":135.7725,"r":2,"best":"morning","hrs":[6.5,17],"blurb":"One of Kyoto's oldest shrines, approached through Tadasu no Mori, an ancient forest at the fork of the Kamo and Takano rivers.","tip":"Kawai Shrine in the grounds sells mirror-shaped ema that you decorate with makeup to pray for beauty."},{"id":"k-kamo-delta","city":"kyoto","n":"Kamo Delta stepping stones","ja":"鴨川デルタ","cat":"play","area":"Demachiyanagi","lat":35.0293,"lng":135.7719,"r":2,"best":"day","blurb":"Where the Kamo and Takano rivers meet, rows of stepping stones, some shaped like turtles and plovers, lead across the water to the delta.","tip":"Pick up mame-mochi at Demachi Futaba, the famous queue a few minutes west.","sn":"Kamo Delta"},{"id":"k-gosho","city":"kyoto","n":"Kyoto Imperial Palace","ja":"京都御所","cat":"garden","area":"Kamigyō","lat":35.02528,"lng":135.76222,"r":1,"best":"day","hrs":[9,15.33],"closed":[1],"blurb":"The emperors' home until 1869. The palace grounds are free to walk in without booking, inside a vast park of gravel avenues and old trees.","tip":"Closed Mondays (including Oct 26). Free guided tours in English start at 10 am and 2 pm, no booking needed.","sn":"Imperial Palace","hrsTxt":"9 am–4 pm, last entry about 3:20 pm; closed Mon"},{"id":"k-daitokuji","city":"kyoto","n":"Daitoku-ji","ja":"大徳寺","cat":"temple","area":"Kita","lat":35.04392,"lng":135.74608,"r":2,"best":"day","hrs":[9,16.5],"blurb":"A walled Zen complex of more than 20 sub-temples. Daisen-in's dry landscape garden is one of the finest in Kyoto.","tip":"Daisen-in, with one of Kyoto’s finest dry gardens, is open all year. The board at the main gate shows which sub-temples are open today.","in":1,"ev":[{"from":"2026-10-10","to":"2026-11-30","h":[10,16],"t":"700th-anniversary special openings","short":"rare openings","note":"Normally closed sub-temples are open: Kōrin-in, Sōken-in, Ōbai-in and Jukō-in (¥800–1,000 each). The organizer lists Ōbai-in closed Oct 28 and Jukō-in Oct 27–28"}]},{"id":"k-kinkakuji","city":"kyoto","n":"Kinkaku-ji","ja":"金閣寺","cat":"temple","area":"Kita","lat":35.0394,"lng":135.72936,"r":3,"best":"morning","hrs":[9,17],"blurb":"The Golden Pavilion, its top two floors covered in gold leaf, reflected in Mirror Pond. A loop path leads past it through the garden.","tip":"Arrive at the 9:00 opening, then walk about 20 minutes to Ryōan-ji.","hrsTxt":"9 am–5 pm"},{"id":"k-ryoanji","city":"kyoto","n":"Ryōan-ji","ja":"龍安寺","cat":"temple","area":"Ukyō","lat":35.03444,"lng":135.71833,"r":3,"best":"morning","hrs":[8,17],"blurb":"The most famous Zen rock garden: 15 stones in raked white gravel. From any seat on the veranda, at least one stone is always hidden from view.","tip":"Wait for a lull and just look. The stone basin behind the hall reads 'I only know contentment.'"},{"id":"k-kitano","city":"kyoto","n":"Kitano Tenmangū","ja":"北野天満宮","cat":"shrine","area":"Kamigyō","lat":35.03111,"lng":135.73528,"r":3,"best":"morning","blurb":"The shrine of Sugawara no Michizane, patron of scholars. Bronze oxen dot the grounds, and students rub their heads for exam luck.","tip":"On the 25th of every month, the Tenjin-san flea market fills the grounds with antiques, kimono and food stalls from early morning.","hrs":[7,17],"ev":[{"dom":25,"h":[6,16],"t":"Tenjin-san flea market","short":"market today"}]},{"id":"k-nijo","city":"kyoto","n":"Nijō Castle","ja":"二条城","cat":"art","area":"Nakagyō","lat":35.01416,"lng":135.7475,"r":2,"best":"day","hrs":[8.75,16],"blurb":"The Tokugawa shōguns' Kyoto residence. The corridors of its Ninomaru Palace have 'nightingale floors' that chirp underfoot to warn of intruders.","tip":"Last entry is 4 pm. The palace is shoes-off, so wear socks.","in":1,"ev":[{"from":"2026-10-23","to":"2026-12-05","h":[18,21],"end":22,"t":"NAKED night illumination","short":"lit tonight","note":"Separate ticket from the day visit (¥2,000 Mon–Thu, ¥2,400 Fri–Sun); last entry 9 pm, grounds close 10 pm"}],"price":"¥1,300 with the Ninomaru Palace; grounds ¥800","hrsTxt":"8:45 am–5 pm, last entry 4 pm"},{"id":"k-toji","city":"kyoto","n":"Tō-ji","ja":"東寺","cat":"temple","area":"Minami","lat":34.9806,"lng":135.7477,"r":2,"best":"day","hrs":[8,17],"blurb":"Its 55-meter five-story pagoda is the tallest wooden pagoda in Japan, the first thing you notice arriving by train. The lecture hall holds a 3D mandala of 21 statues.","tip":"The Kōbō-san flea market fills the grounds on the 21st of every month.","in":1},{"id":"k-bamboo","city":"kyoto","n":"Arashiyama Bamboo Grove","ja":"竹林の小径","cat":"garden","area":"Arashiyama","lat":35.0168,"lng":135.6716,"r":3,"best":"morning","blurb":"A path through towering bamboo that creaks and rustles in the wind. Short, and very crowded after about 9 am.","tip":"Go at sunrise, then keep going uphill to Ōkōchi Sansō or north to Otagi Nenbutsu-ji to escape the crowds.","sn":"Bamboo Grove","ev":[{"from":"2026-09-30","to":"2026-11-08","h":[18,20.67],"end":21,"t":"Tsukitōro bamboo light-up","short":"lit tonight","note":"¥1,500 at the gate (cash) or ¥2,000 online with guaranteed entry; last entry 8:40 pm"}]},{"id":"k-tenryuji","city":"kyoto","n":"Tenryū-ji","ja":"天龍寺","cat":"temple","area":"Arashiyama","lat":35.01596,"lng":135.67377,"r":2,"best":"morning","hrs":[8.5,17],"blurb":"Arashiyama's great Zen temple, with a 14th-century pond garden by Musō Soseki that borrows the mountains behind it as scenery.","tip":"The garden's north gate opens right onto the bamboo grove."},{"id":"k-okochi","city":"kyoto","n":"Ōkōchi Sansō","ja":"大河内山荘","cat":"garden","area":"Arashiyama","lat":35.01728,"lng":135.66935,"r":2,"best":"day","hrs":[9,17],"blurb":"The hillside villa garden of 1930s samurai-film star Denjirō Ōkōchi, with paths to views over Kyoto and the Hozu gorge. Admission includes matcha and a sweet.","tip":"It's at the top of the bamboo grove path, where most people turn around."},{"id":"k-togetsukyo","city":"kyoto","n":"Togetsu-kyō Bridge","ja":"渡月橋","cat":"view","area":"Arashiyama","lat":35.01286,"lng":135.67775,"r":2,"best":"day","blurb":"The 'Moon-Crossing Bridge' spans the Katsura River in front of the forested Arashiyama hills.","tip":"Rent a rowboat just upstream of the bridge for a quiet half hour on the river."},{"id":"k-otagi","city":"kyoto","n":"Otagi Nenbutsu-ji","ja":"愛宕念仏寺","cat":"temple","area":"Sagano","lat":35.0328,"lng":135.6617,"r":3,"best":"day","hrs":[8,16.5],"blurb":"1,200 mossy stone rakan statues carved by amateurs in the 1980s, each with its own face: laughing, drinking sake, holding a tennis racket or a camera.","tip":"A 20-minute uphill walk from the bamboo grove through the old Saga-Toriimoto street, or take the bus."},{"id":"k-gioji","city":"kyoto","n":"Giō-ji","ja":"祇王寺","cat":"garden","area":"Sagano","lat":35.0233,"lng":135.668,"r":2,"best":"day","hrs":[9,16.5],"blurb":"A tiny thatched nunnery in a moss garden under maples, tied to the story of a court dancer in the Tale of the Heike.","tip":"Small and softly lit. Give it 20 quiet minutes."},{"id":"k-kurama","city":"kyoto","n":"Kurama-dera","ja":"鞍馬寺","cat":"temple","area":"Kurama","lat":35.11806,"lng":135.77074,"r":3,"best":"morning","hrs":[9,16.5],"blurb":"A mountain temple north of the city, reached on the little Eizan train. Hike over the ridge past giant cedar roots down to Kibune, about 90 minutes.","tip":"Up here, autumn color arrives earlier than in the city."},{"id":"k-kibune","city":"kyoto","n":"Kifune Shrine","ja":"貴船神社","cat":"shrine","area":"Kibune","lat":35.12167,"lng":135.76278,"r":2,"best":"day","blurb":"A shrine to the water god (locals say Kifune; the village is Kibune), approached by stone steps lined with red lanterns. Float a water fortune in the spring and your fortune appears.","tip":"Pair it with the hike over the ridge from Kurama."},{"id":"k-byodoin","city":"kyoto","n":"Byōdō-in, Uji","ja":"平等院","cat":"temple","area":"Uji","lat":34.88944,"lng":135.80778,"r":2,"best":"day","hrs":[8.5,17.25],"blurb":"The Phoenix Hall from 1053, mirrored in its pond, is the building on the 10-yen coin. Uji is also one of Japan's oldest matcha towns.","tip":"Have matcha soba or a matcha parfait on the approach street.","sn":"Byōdō-in"},{"id":"k-shisendo","city":"kyoto","n":"Shisen-dō","ja":"詩仙堂","cat":"garden","area":"Ichijōji","lat":35.04374,"lng":135.79623,"r":2,"best":"day","hrs":[9,17],"blurb":"A 17th-century hermitage built by a samurai turned poet, with portraits of 36 Chinese poets and a raked garden where a bamboo deer-scarer clacks now and then.","tip":"Sit on the tatami facing the garden. Enkō-ji, a short walk away, is quieter still.","in":1},{"id":"k-manga","city":"kyoto","n":"Kyoto Manga Museum","ja":"京都国際マンガミュージアム","cat":"art","area":"Nakagyō","lat":35.01165,"lng":135.75924,"r":2,"best":"day","hrs":[10,16.5],"blurb":"A former elementary school turned manga library, with about 50,000 volumes on open shelves you can pull down and read, including on the lawn outside.","tip":"Closed Wednesdays. Good for a rainy afternoon; some shelves hold manga in English.","closed":[3],"in":1,"sn":"Manga Museum"},{"id":"k-fushimi-sake","city":"kyoto","n":"Fushimi sake district","ja":"伏見酒蔵","cat":"food","area":"Fushimi","lat":34.93004,"lng":135.76083,"r":2,"best":"afternoon","hrs":[9.5,16.5],"blurb":"Kyoto's sake-brewing quarter, where soft groundwater feeds breweries along a willow-lined canal. Gekkeikan's Ōkura museum ends with a tasting.","tip":"The Gekkeikan museum is cashless only. Take the short jikkokubune boat ride on the canal, then try a tasting flight nearby.","in":1,"sn":"Fushimi sake"},{"id":"t-kyu-furukawa","city":"tokyo","n":"Kyū-Furukawa Gardens","ja":"旧古河庭園","sn":"Kyū-Furukawa","cat":"garden","area":"Komagome","lat":35.7425,"lng":139.74611,"r":2,"best":"day","hrs":[9,16.5],"ev":[{"from":"2026-10-10","to":"2026-11-06","h":[9,16.5],"t":"Autumn Rose Festival","short":"roses out","note":"About 100 varieties in bloom on the terraces"}],"blurb":"A stone mansion by Josiah Conder above terraced, French-style rose beds. At the foot of the slope is a Japanese garden by Ogawa Jihei with a heart-shaped pond and a cliff waterfall.","tip":"Matcha is served in the thatched teahouse by the pond. Weekday mornings are quietest during the rose festival.","price":"¥150; mansion tours extra (book ahead)","hrsTxt":"9 am–5 pm, last entry 4:30 pm","addr":"東京都北区西ケ原1-27-39"},{"id":"t-toshogu","city":"tokyo","n":"Ueno Tōshōgū","ja":"上野東照宮","sn":"Tōshōgū","cat":"shrine","area":"Ueno","lat":35.7154,"lng":139.7706,"r":2,"best":"day","hrs":[9,16.5],"blurb":"A gold-leafed 1651 shrine to Tokugawa Ieyasu in Ueno Park, nicknamed the Golden Hall. Dragons carved on its Karamon gate are said to slip out at night to drink from Shinobazu Pond.","tip":"The approach is free. The ¥700 area inside the carved fence is open 9:30 am to 4 pm this time of year.","price":"Free; inner area ¥700","hrsTxt":"9 am–4:30 pm; inner area 9:30 am–4 pm"},{"id":"t-iwasaki","city":"tokyo","n":"Kyū-Iwasaki-tei Gardens","ja":"旧岩崎邸庭園","sn":"Iwasaki House","cat":"art","area":"Ueno","lat":35.70972,"lng":139.76778,"r":2,"best":"day","hrs":[9,16.5],"in":1,"blurb":"The 1896 mansion of the family that founded Mitsubishi, designed by Josiah Conder: Jacobean woodwork, gilded leather wallpaper and a billiard house like a Swiss chalet, joined to a Japanese wing.","tip":"No photos indoors on weekends and holidays. Matcha and a sweet are served in the Japanese wing.","price":"¥400; matcha set ¥1,000","hrsTxt":"9 am–5 pm, last entry 4:30 pm","addr":"東京都台東区池之端1-3-45"},{"id":"t-asakura","city":"tokyo","n":"Asakura Museum of Sculpture","ja":"朝倉彫塑館","sn":"Asakura Museum","cat":"art","area":"Yanaka","lat":35.72688,"lng":139.76854,"r":2,"best":"day","hrs":[9.5,16],"closed":[1,4],"in":1,"blurb":"The sculptor Asakura Fumio’s home and studio, built to his own design in 1935 around a spring-fed courtyard pond. Upstairs are a room of his cat sculptures and one of Tokyo’s oldest roof gardens.","tip":"Closed Mondays and Thursdays (including Oct 22). Shoes come off at the door, and the roof garden may shut in bad weather.","price":"¥500","hrsTxt":"9:30 am–4:30 pm, last entry 4 pm; closed Mon & Thu","addr":"東京都台東区谷中7-18-10"},{"id":"t-daikokuya","city":"tokyo","n":"Daikokuya Tempura","ja":"大黒家天麩羅 本店","sn":"Daikokuya","cat":"food","area":"Asakusa","lat":35.71278,"lng":139.79553,"r":2,"best":"lunch","hrs":[11,19.5],"in":1,"blurb":"Asakusa’s best-known tendon house, in business since 1887: tempura fried in sesame oil, piled on rice under a dark, sweet sauce.","tip":"Cash only. Mid-afternoon and after 6:30 pm are quietest; a nearby annex serves the same menu when the main shop has a line.","price":"¥2,300–2,900; cash only","order":"Tendon (prawns and kakiage on rice), or the four-prawn ebi tendon","res":"No bookings; lines at peak lunch and dinner","hrsTxt":"11 am–8 pm daily; arrive by 7:30 pm","addr":"東京都台東区浅草1-38-10"},{"id":"t-namiki-yabu","city":"tokyo","n":"Namiki Yabu Soba","ja":"並木藪蕎麦","sn":"Namiki Yabu","cat":"food","area":"Asakusa","lat":35.70967,"lng":139.79599,"r":2,"best":"lunch","hrs":[11,19],"closed":[3,4],"in":1,"blurb":"An Edo-style soba house opened in 1913 a block south of Kaminarimon, known for its bold, dark dipping sauce and old-school service.","tip":"Closed Wednesdays and Thursdays. Dip just the ends of the noodles; the sauce is strong.","price":"¥950–2,300","order":"Zaru soba, or ten-zaru with tempura; itawasa (fish cake) with a beer","res":"No bookings; short waits at weekend lunch","hrsTxt":"11 am–7:30 pm (last orders 7); closed Wed & Thu","addr":"東京都台東区雷門2-11-9"},{"id":"t-maekawa","city":"tokyo","n":"Komagata Maekawa","ja":"駒形前川 浅草本店","sn":"Maekawa","cat":"food","area":"Komagata","lat":35.70822,"lng":139.79625,"r":2,"best":"lunch","hrs":[11.5,20.5],"in":1,"blurb":"An eel house founded in the 1800s, on the Sumida River bank south of Asakusa, with big windows over the water.","tip":"The splurge of the list. Lunch avoids the 10% service charge added from 4 pm; ask for a river-side table.","price":"Unajū from ¥6,300; +10% from 4 pm","order":"Unajū (grilled eel over rice) with kimosui, eel-liver soup","res":"Book dinner and window tables online or by phone; weekday lunch walk-ins usually get in","hrsTxt":"11:30 am–9 pm daily (last orders 8:30)","addr":"東京都台東区駒形2-1-29"},{"id":"t-kamiya","city":"tokyo","n":"Kamiya Bar","ja":"神谷バー","cat":"food","sub":"bar","area":"Asakusa","lat":35.71088,"lng":139.79747,"r":2,"best":"evening","hrs":[11,19.5],"closed":[2],"in":1,"blurb":"Opened in 1880 and billed as Japan’s oldest Western-style bar: a bustling hall by Asakusa Station where the writers Kawabata and Tanizaki drank. The house Denki Bran is a sweet, strong brandy cocktail.","tip":"It closes at 8 pm these days, plus Tuesdays and two Mondays a month. On the ground floor, buy tickets at the register first; cash only.","price":"Denki Bran ¥400; dishes ¥650–1,000","order":"Denki Bran with beef stew or a crab-cream croquette","res":"Ground floor is walk-in only","hrsTxt":"11 am–8 pm (last orders 7:30); closed Tue","addr":"東京都台東区浅草1-1-1"},{"id":"t-royal-coffee","city":"tokyo","n":"Royal Coffee Shop","ja":"ローヤル珈琲店 本店","sn":"Royal Coffee","cat":"food","sub":"cafe","area":"Asakusa","lat":35.71274,"lng":139.79439,"r":2,"best":"morning","hrs":[8,20],"in":1,"blurb":"A 1962 kissaten (old-style coffee house) with red sofas and chandeliers, a few minutes from Sensō-ji. It opens at 8 for a proper Japanese “morning set.”","tip":"Cash only. Weekend mornings fill fast, so come right at 8.","price":"Morning sets from ¥840; cash only","order":"A morning set: thick toast or an egg sandwich with coffee","res":"No bookings","hrsTxt":"8 am–8 pm daily","addr":"東京都台東区浅草1-39-7"},{"id":"t-umezono","city":"tokyo","n":"Umezono","ja":"梅園 浅草本店","cat":"food","sub":"cafe","area":"Asakusa","lat":35.71241,"lng":139.79627,"r":2,"best":"afternoon","hrs":[10,16.5],"hx":{"0":[10,17.5],"6":[10,17.5]},"in":1,"blurb":"A sweet shop founded in 1854 beside Sensō-ji and credited with inventing awa-zenzai: soft millet mochi under thick, hot red-bean paste.","tip":"Cash only. Order and pay at the register, then sit. It closes on a couple of Wednesdays a month.","price":"Sweets ¥850–1,100; cash only","order":"Awa-zenzai, or anmitsu with hot tea","res":"No bookings","hrsTxt":"10 am–5 pm weekdays, to 6 pm weekends (last orders 30 min before)","addr":"東京都台東区浅草1-31-12"},{"id":"t-kayaba","city":"tokyo","n":"Kayaba Coffee","ja":"カヤバ珈琲","cat":"food","sub":"cafe","area":"Yanaka","lat":35.72116,"lng":139.77075,"r":2,"best":"morning","hrs":[8,16.5],"hx":{"0":[8,17.5],"6":[8,17.5]},"closed":[1],"in":1,"blurb":"A 1938 wooden shop-house café on a Yanaka corner, revived in 2009, with tatami seating upstairs and a famous thick egg sandwich.","tip":"Book the night before; walk-ins rarely get a table and queuing outside isn’t allowed. Pair it with the Yanaka temple lanes.","price":"Egg sandwich ¥1,500; coffee from ¥650","order":"The Kayaba classic egg sandwich and coffee pudding, or a “Russian” (coffee with cocoa)","res":"Online at yoyaku.toreta.in/kayabacoffee until 11:59 pm the day before; 90-minute seatings","hrsTxt":"8 am–5 pm weekdays, to 6 pm weekends; closed Mon","addr":"東京都台東区谷中6-1-29"},{"id":"t-lupin","city":"tokyo","n":"Bar Lupin","ja":"ルパン","cat":"food","sub":"bar","area":"Ginza","lat":35.67096,"lng":139.76326,"r":2,"best":"evening","hrs":[17,23],"closed":[0],"in":1,"blurb":"A basement bar open since 1928, once a haunt of the novelist Dazai Osamu, reached down a narrow back alley and through a heavy door.","tip":"Cash only. Look for the red-and-white sign at the alley mouth; it’s easy to walk past. Come at 5 for a seat.","price":"Cover ¥880; cocktails from about ¥1,200; cash only","order":"The Golden Fizz (a gin fizz with egg yolk) or a gimlet","res":"No bookings; fills from about 6 pm","hrsTxt":"5–11:30 pm; closed Sun","addr":"東京都中央区銀座5-5-11 塚本不動産ビルB1F"},{"id":"t-matsuya","city":"tokyo","n":"Kanda Matsuya","ja":"神田まつや 本店","sn":"Kanda Matsuya","cat":"food","area":"Kanda","lat":35.69619,"lng":139.76883,"r":2,"best":"lunch","hrs":[11,20],"hx":{"6":[11,19]},"closed":[0,1],"in":1,"blurb":"A soba house founded in 1884, in a designated historic wooden building in Kanda’s old-shop quarter.","tip":"Cash only. The same lanes hold more century-old shops, including Kanda Yabu Soba and the monkfish-hotpot house Isegen.","price":"¥1,300–1,800; cash only","order":"Zaru or goma soba; kashiwa-nanban (hot chicken soba); a yakitori skewer with a small beer","res":"No bookings; short waits at lunch","hrsTxt":"11 am–8:30 pm, Sat to 7:30 (last orders 30 min before); closed Sun & Mon","addr":"東京都千代田区神田須田町1-13"},{"id":"k-higashi-honganji","city":"kyoto","n":"Higashi Hongan-ji","ja":"東本願寺","cat":"temple","area":"Kyoto Station","lat":34.99102,"lng":135.75846,"r":2,"best":"day","hrs":[5.83,17.5],"in":1,"blurb":"A head temple of Shin Buddhism five minutes’ walk from Kyoto Station. Its Founder’s Hall is one of the largest wooden buildings in the world, with 927 tatami mats inside.","tip":"Free, and the shoes-off halls are open to anyone. In the corridor between the halls, look for the giant rope twisted from hemp and human hair that hauled the timbers.","price":"Free","hrsTxt":"5:50 am–5:30 pm"},{"id":"k-nishi-honganji","city":"kyoto","n":"Nishi Hongan-ji","ja":"西本願寺","cat":"temple","area":"Kyoto Station","lat":34.99205,"lng":135.75162,"r":2,"best":"day","hrs":[5.5,17],"blurb":"A UNESCO-listed head temple whose two vast halls, both National Treasures, are open to walk into. Its carved Karamon gate is nicknamed the gate you could gaze at all day.","tip":"Free. The 400-year-old ginkgo by the Founder’s Hall is said to have sprayed water to put out a fire.","price":"Free","hrsTxt":"5:30 am–5 pm"},{"id":"k-station","city":"kyoto","n":"Kyoto Station Grand Staircase","ja":"京都駅ビル 大階段","sn":"Station Staircase","cat":"view","area":"Kyoto Station","lat":34.98544,"lng":135.75778,"r":1,"best":"evening","hrs":[6,23],"in":1,"ev":[{"from":"2026-10-01","to":"2026-11-30","h":[17,22],"t":"Evening lights","short":"lights on","note":"LED shows play across the 171 steps from 3 pm, and the 10th-floor Skyway is lit from 5 pm"}],"blurb":"Kyoto Station’s huge atrium hides a free viewpoint: 171 steps climb to a rooftop garden 60 m up, and a Skyway corridor runs the length of the building 45 m above the street.","tip":"Go at dusk for the light shows on the steps. The rooftop garden closes for years of construction from Nov 27, so this is a last look.","price":"Free","hrsTxt":"Staircase and rooftop 6 am–11 pm; Skyway 10 am–10 pm"},{"id":"k-koryuji","city":"kyoto","n":"Kōryū-ji","ja":"広隆寺","cat":"temple","area":"Uzumasa","lat":35.0155,"lng":135.70731,"r":2,"best":"day","hrs":[9,17],"in":1,"blurb":"Kyoto’s oldest temple, founded in 603. Its treasure hall holds the Crowned Maitreya, a slender red-pine Buddha in quiet thought, said to be the first object ever named a National Treasure.","tip":"Give the Maitreya a few minutes on its own. Toei’s Uzumasa film village is a short walk away.","price":"Treasure hall ¥800","hrsTxt":"9 am–5 pm"},{"id":"k-ninnaji","city":"kyoto","n":"Ninna-ji","ja":"仁和寺","cat":"temple","area":"Omuro","lat":35.031,"lng":135.7138,"r":2,"best":"day","hrs":[9,16.5],"ev":[{"from":"2026-10-25","to":"2026-10-25","h":[18.5,20.5],"end":21,"t":"Maple light-up","short":"lit tonight","note":"Fridays to Sundays only, so Sun Oct 25 is the one night in your stay. Book online for that date; last entry 8:30 pm"},{"from":"2026-10-23","to":"2026-11-08","h":[9,16],"t":"Sutra repository open","short":"Kyōzō open","note":"A rare look inside the Kyōzō, a revolving bookcase holding 768 boxes of scripture, ¥800"}],"blurb":"A vast imperial temple with a 1644 five-story pagoda and a Golden Hall that was once part of the Imperial Palace. Inside its Goten, verandas look onto raked-gravel and pond gardens.","tip":"The grounds are free. Ryōan-ji is about 15 minutes’ walk east, and Kinkaku-ji beyond it.","price":"Grounds free; Goten ¥800","hrsTxt":"Goten 9 am–5 pm, last entry 4:30 pm"},{"id":"k-taizoin","city":"kyoto","n":"Taizō-in","ja":"退蔵院","cat":"garden","area":"Hanazono","lat":35.02188,"lng":135.71923,"r":2,"best":"day","hrs":[9,17],"blurb":"A sub-temple of the huge Myōshin-ji complex with two very different gardens: a dry landscape credited to the painter Kanō Motonobu, and a 1960s stroll garden of ponds, waterfalls and a water-harp cave.","tip":"Myōshin-ji’s Dharma Hall next door has a cloud dragon by Kanō Tan’yū glaring down from the ceiling (¥500, last entry 3:30 pm).","price":"¥600","hrsTxt":"9 am–5 pm"},{"id":"k-murinan","city":"kyoto","n":"Murin-an","ja":"無鄰菴","cat":"garden","area":"Okazaki","lat":35.0116,"lng":135.7872,"r":2,"best":"day","hrs":[9,16.5],"blurb":"A Meiji statesman’s villa whose garden draws canal water into a stream and borrows the Higashiyama hills as its backdrop, with an open lawn where most Kyoto gardens have moss.","tip":"Book a time slot online; walk-ins can be turned away. On Oct 28 entry is free for visitors 35 and under (bring ID).","price":"¥600 (Oct 25–28); matcha and a sweet ¥1,200","res":"Hourly time slots online, up to 30 days ahead and until an hour before","hrsTxt":"9 am–5 pm, last entry 4:30 pm","addr":"京都府京都市左京区南禅寺草川町31"},{"id":"k-seiryuden","city":"kyoto","n":"Shōgunzuka Seiryūden","ja":"将軍塚青龍殿","sn":"Seiryūden","cat":"view","area":"Higashiyama","lat":35.00208,"lng":135.78695,"r":2,"best":"afternoon","hrs":[9,16.5],"blurb":"A hilltop hall of Shōren-in whose wooden stage, more than four times the size of Kiyomizu-dera’s, looks across the whole Kyoto basin.","tip":"There’s no bus: take a taxi (about 5 minutes from Keage Station) or hike about 30 minutes up the trail from Shōren-in.","price":"¥600","hrsTxt":"9 am–5 pm, last entry 4:30 pm"},{"id":"k-kawai","city":"kyoto","n":"Kawai Kanjirō’s House","ja":"河井寛次郎記念館","sn":"Kawai House","cat":"art","area":"Gojō-zaka","lat":34.99318,"lng":135.77458,"r":2,"best":"day","hrs":[10,16.5],"closed":[1],"in":1,"blurb":"The potter Kawai Kanjirō’s home and studio, which he designed in 1937, kept as he lived in it: an open hearth, furniture he made or collected, and a climbing kiln out back.","tip":"Closed Mondays (including Oct 26). About 8 minutes’ walk from Kiyomizu-Gojō Station.","price":"¥900","hrsTxt":"10 am–5 pm, last entry 4:30 pm; closed Mon","addr":"京都府京都市東山区五条坂鐘鋳町569"},{"id":"k-kamigamo","city":"kyoto","n":"Kamigamo Shrine","ja":"上賀茂神社","sn":"Kamigamo","cat":"shrine","area":"Kita","lat":35.06028,"lng":135.75278,"r":2,"best":"morning","hrs":[5.5,17],"ev":[{"from":"2026-10-25","to":"2026-10-25","h":[9,16],"t":"Handicraft market","short":"craft market","note":"The monthly tezukuri-ichi of local makers, held on the fourth Sunday"}],"blurb":"One of Kyoto’s oldest shrines, a UNESCO site at the city’s northern edge. Two cones of white sand before its hall stand for the sacred mountain behind it.","tip":"On Sundays the shrine’s sacred horse is usually out in the morning. The inner sanctuary visit (¥500) runs 10 am to 4 pm.","price":"Grounds free; inner sanctuary ¥500","hrsTxt":"Grounds 5:30 am–5 pm","addr":"京都府京都市北区上賀茂本山339"},{"id":"k-kyohaku","city":"kyoto","n":"Kyoto National Museum","ja":"京都国立博物館","sn":"Kyoto Natl. Museum","cat":"art","area":"Higashiyama","lat":34.99066,"lng":135.7724,"r":2,"best":"day","hrs":[9,17],"hx":{"5":[9,19.5]},"closed":[1],"in":1,"blurb":"This autumn the museum is given over to one big show, The Tale of Genji, with screens, scrolls and a portrait of Murasaki Shikibu. The regular galleries are closed until late December.","tip":"Closed Mondays (including Oct 26). Sanjūsangen-dō is just across the street.","price":"¥2,200 (Tale of Genji)","hrsTxt":"9 am–5:30 pm (last entry 5); Fridays to 8 pm; closed Mon","addr":"京都府京都市東山区茶屋町527"},{"id":"k-junsei","city":"kyoto","n":"Nanzen-ji Junsei","ja":"南禅寺 順正","sn":"Junsei","cat":"food","area":"Okazaki","lat":35.01195,"lng":135.79059,"r":2,"best":"lunch","hrs":[[11,14.5],[17,19]],"in":1,"blurb":"Yudōfu, tofu simmered at the table, served in a garden estate just outside Nanzen-ji. Its Edo-period study hall was once a medical school.","tip":"Pair it with Nanzen-ji. It sometimes closes on Wednesdays, so call ahead (075-761-2311) before going on Oct 28.","price":"Yudōfu courses from ¥3,850","order":"The Hana course: yudōfu with fresh yuba, sesame tofu and tofu dengaku","res":"Yudōfu courses are walk-in only, first come first served; arrive near 11 am","hrsTxt":"Lunch 11 am–3:30 pm (last orders 2:30); dinner 5–9:30 pm (last seating 7)","addr":"京都府京都市左京区南禅寺草川町60"},{"id":"k-gonbei","city":"kyoto","n":"Gion Gonbei","ja":"権兵衛","sn":"Gonbei","cat":"food","area":"Gion","lat":35.00402,"lng":135.7744,"r":2,"best":"lunch","hrs":[[11.5,14.67],[17,19.67]],"hx":{"0":[11.5,19.67],"6":[11.5,19.67]},"closed":[4],"in":1,"blurb":"An unfussy Gion noodle house known for keiran udon, a Kyoto comfort bowl of egg ribbons in thickened broth.","tip":"A cheap, quick lunch between Yasaka Shrine and Hanamikōji. Closed Thursdays.","price":"¥1,200–3,000","order":"Keiran udon, nabeyaki udon or anago (sea eel) soba","res":"Walk-in only","hrsTxt":"11:30 am–3 pm and 5–8 pm; weekends 11:30 am–8 pm; closed Thu","addr":"京都府京都市東山区祇園町北側254"},{"id":"k-izuu","city":"kyoto","n":"Izuu","ja":"いづう 本店","cat":"food","area":"Gion","lat":35.00488,"lng":135.77478,"r":2,"best":"lunch","hrs":[11,21.5],"hx":{"0":[11,20.5]},"closed":[2],"in":1,"blurb":"Making Kyoto’s classic mackerel sushi since 1781: a whole cured mackerel pressed onto rice, eaten at a plain counter in the Gion lanes.","tip":"Closed Tuesdays (including Oct 27). For a train picnic, phone from 8 am to order saba-zushi to take away (075-561-0751).","price":"Saba-zushi ¥2,200 for 4 pieces","order":"Saba-zushi, or the Kyō-zushi assortment","res":"No bookings to eat in","hrsTxt":"11 am–10 pm (Sun to 9); closed Tue","addr":"京都府京都市東山区八坂新地清本町367"},{"id":"k-kagizen","city":"kyoto","n":"Kagizen Yoshifusa","ja":"鍵善良房 四条本店","sn":"Kagizen","cat":"food","sub":"cafe","area":"Gion","lat":35.00404,"lng":135.77475,"r":2,"best":"afternoon","hrs":[10,17.5],"closed":[1],"in":1,"blurb":"A Gion confectioner of about 300 years, famous for kuzukiri: clear noodles of kudzu starch, cut to order and dipped in dark sugar syrup.","tip":"Closed Mondays (including Oct 26). It’s made to order, so there may be a short wait.","price":"Kuzukiri about ¥1,600","order":"Kuzukiri with kuromitsu (black-sugar syrup)","res":"No bookings; queues at peak times","hrsTxt":"Café 10 am–6 pm (last orders 5:30); closed Mon","addr":"京都府京都市東山区祇園町北側264"},{"id":"k-issen","city":"kyoto","n":"Issen Yōshoku","ja":"壹銭洋食 本店","sn":"Issen Yōshoku","cat":"food","area":"Gion","lat":35.00395,"lng":135.77336,"r":1,"best":"evening","hrs":[11,25],"hx":{"5":[11,27],"6":[11,27],"0":[10.5,22]},"in":1,"blurb":"The shop that keeps Kyoto’s old one-sen yōshoku street snack alive: a cheap griddled pancake of batter, dashi f the prices.","price":"¥2,000–3,000","order":"Crab croquette, kizushi (vinegared mackerel), octopus sashimi and a big bottle of beer","res":"Walk-in only","hrsTxt":"Noon–9 pm (last orders 8:45); closed Tue","addr":"京都府京都市中京区新京極通四条上ル中之町546"}]</script>

/* ---------------- marks (local + shared db) ---------------- */
function toggleMark(id, k){

  S.marks[id] = m; persist(); pushMark(id);
  var p = PBY[id], msg = '';

  if (k === 'seen') msg = m.seen ? 'Marked ' + p.n + ' as visited' : 'Unmarked ' + p.n;
  if (k === 'hidden') msg = m.hidden ? 'Hid ' + p.n : 'Showing ' + p.n + ' again';
  if ((k === 'hidden' && m.hidden) || (k === 'seen' && m.seen)){ if (S.sel === id) closeSheets(); }
  refresh(false); if (S.sel === id && sheetOpen === 'placeSheet') renderPlace(); if (sheetOpen === 'menuSheet') renderMenu();
  toast(msg, { l:'Undo', fn:function(){ S.marks[id] = Object.assign({}, prev, { t:Date.now() }); persist(); pushMark(id); refresh(false); if (S.sel === id && sheetOpen === 'placeSheet') renderPlace(); if (sheetOpen === 'menuSheet') renderMenu(); } });
}
// Sync model: one doc per place, last writer wins by the mark's own timestamp t.
// Local changes are "dirty" until a write is confirmed; definitive (non-cache) snapshots push whatever is still newer here.
var dbCol = null, dbWriting = {}, dbQueued = {}, dbReadOnly = false, dbRemote = {}, dbDirty = {}, dbSynced = false, dbResub = 0;
function pushMark(id){
  if (!PBY[id]) return; dbDirty[id] = true;
  if (!dbCol || dbReadOnly) return;
  if (dbWriting[id]){ dbQueued[id] = true; return; }
  dbWriting[id] = true;
  var m = mark(id), body = { fav:!!m.fav, seen:!!m.seen, hidden:!!m.hidden, t:m.t || Date.now() }, tries = 0, col = dbCol;
  function done(){ dbWriting[id] = false; if (dbQueued[id]){ dbQueued[id] = false; pushMark(id); } }

    col.doc(id).set(body).then(function(){ dbRemote[id] = Math.max(dbRemote[id] || 0, body.t); if ((mark(id).t || 0) <= body.t) delete dbDirty[id]; done(); }, function(e){
      var c = e && e.code;
      if (c === 'invalid_argument' || c === 'transform_error'){ dbReadOnly = true; if (sheetOpen === 'menuSheet') renderMenu(); return done(); }
      if (c === 'revoked' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed'){ dbCol = null; if (sheetOpen === 'menuSheet') renderMenu(); return done(); }
      if (c === 'quota_exceeded'){ toast('Couldn’t sync that change: the shared list is full.'); return done(); }
      if (c === 'resource_exhausted') return done();   // stays dirty; the next definitive snapshot retries
      if (tries++ < 1){ setTimeout(attempt, 500 + Math.random() * 1500); return; }   // unavailable / unknown: retry once
      done();
    });

}
function onMarksSnap(snap){
  var changed = false;
  snap.docs.forEach(function(d){ if (!d.exists || !PBY[d.id]) return; var r = d.data() || {}, rt = +r.t || 0, l = S.marks[d.id];
    dbRemote[d.id] = rt;
    if (!l || rt > (l.t || 0)){ S.marks[d.id] = { fav:!!r.fav, seen:!!r.seen, hidden:!!r.hidden, t:rt }; delete dbDirty[d.id]; changed = true; } });

    if (todo.length) setTimeout(function(){ todo.forEach(pushMark); }, 0);
  }

function initDb(){
