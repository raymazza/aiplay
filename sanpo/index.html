<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A walking map for Tokyo and Kyoto that follows your GPS and suggests what is open nearby.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sanpo">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sanpo Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#EEF1EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Signika:wght@400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&text=%E6%95%A3%E6%AD%A9&display=swap">
<style>
/* Layout: a full-bleed transit-style map; header + filter chips on top, distance bands and a rising sheet at the bottom.
   Palette: pale washi-grey land, bay blue, torii vermilion accent, location blue. */
:root{
  --land:#EEF1EC; --water:#B8D2E2; --river:#A3C6DD; --water-ink:#4D7FA1; --green:#C9E2BC; --hill:#DAE5D0; --hill-ink:#6E8A63;
  --border:#C3CBC7;
  --ink:#1B2830; --ink-2:#4A5963; --ink-3:#66737B;
  --surface:#FFFFFF; --surface-2:#F2F5F2; --line:#DCE2DE; --scrim:rgba(16,28,34,.28);
  --accent:#D63F22; --accent-ink:#FFFFFF; --accent-soft:#FBE7E2;
  --you:#1A73E8; --you-soft:rgba(26,115,232,.18); --gold:#D9960F;
  --ok:#23804A; --warn:#A86A12; --bad:#B8362A;
  --c-shrine:#D7442B; --c-temple:#9A6A12; --c-streets:#3D4E97; --c-food:#C56500;
  --c-garden:#2C7C4A; --c-art:#7A43B4; --c-view:#13808F; --c-play:#BD3373;
  --shadow:0 10px 28px rgba(16,32,40,.17),0 1px 3px rgba(16,32,40,.13);
  --shadow-sm:0 3px 10px rgba(16,32,40,.16),0 1px 2px rgba(16,32,40,.12);
  --font-ui:"Signika","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --font-display:"Dela Gothic One","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  --font-ja:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --land:#1A2026; --water:#0F2536; --river:#173A52; --water-ink:#79A9C9; --green:#22392B; --hill:#1F2B22; --hill-ink:#7E9C74;
  --border:#34414A;
  --ink:#E8EEF1; --ink-2:#B1BDC3; --ink-3:#8E9BA2;
  --surface:#232B32; --surface-2:#2B343C; --line:#38434C; --scrim:rgba(0,0,0,.45);
  --accent:#FF6B4E; --accent-ink:#1B0D09; --accent-soft:#3A221D;
  --you:#4D9CFF; --you-soft:rgba(77,156,255,.22); --gold:#F2BC45;
  --ok:#5BC489; --warn:#E3A84B; --bad:#FF7A6B;
  --c-shrine:#FF7458; --c-temple:#E2B45A; --c-streets:#9CAEF2; --c-food:#FFAE57;
  --c-garden:#6FCB91; --c-art:#C49BF3; --c-view:#5CCCDB; --c-play:#F27DB2;
  --shadow:0 10px 28px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4);
  --shadow-sm:0 3px 10px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --land:#1A2026; --water:#0F2536; --river:#173A52; --water-ink:#79A9C9; --green:#22392B; --hill:#1F2B22; --hill-ink:#7E9C74;
  --border:#34414A;
  --ink:#E8EEF1; --ink-2:#B1BDC3; --ink-3:#8E9BA2;
  --surface:#232B32; --surface-2:#2B343C; --line:#38434C; --scrim:rgba(0,0,0,.45);
  --accent:#FF6B4E; --accent-ink:#1B0D09; --accent-soft:#3A221D;
  --you:#4D9CFF; --you-soft:rgba(77,156,255,.22); --gold:#F2BC45;
  --ok:#5BC489; --warn:#E3A84B; --bad:#FF7A6B;
  --c-shrine:#FF7458; --c-temple:#E2B45A; --c-streets:#9CAEF2; --c-food:#FFAE57;
  --c-garden:#6FCB91; --c-art:#C49BF3; --c-view:#5CCCDB; --c-play:#F27DB2;
  --shadow:0 10px 28px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4);
  --shadow-sm:0 3px 10px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.35);
  color-scheme:dark;
}
html{box-sizing:border-box}
html,body{height:100%}
body{background:var(--land);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.4;overflow:hidden;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,a,select,label{touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;-webkit-tap-highlight-color:transparent}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.fill{fill:currentColor;stroke:none}
:focus-visible{outline:2px solid var(--you);outline-offset:2px}
#app{position:relative;height:100%;width:100%;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sel-ok{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}

/* ---- Leaflet core (inlined subset of leaflet.css 1.9.4) ---- */
.leaflet-pane,.leaflet-marker-icon,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:var(--font-ui);outline:0}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:none;touch-action:pinch-zoom}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-pane{z-index:400}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}
.leaflet-map-pane canvas{z-index:100}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-pane>svg path,.leaflet-pane>canvas{pointer-events:none}
.leaflet-control-container{display:none}

#map{position:absolute;inset:0;background:var(--water)}
#map.land{background:var(--land)}

/* ---- overlay (lives inside the map container so drags that start on a bubble still pan the map) ---- */
#ov{position:absolute;inset:0;pointer-events:none;z-index:500;overflow:hidden}
#ov>*{position:absolute;left:0;top:0}
.mk{pointer-events:auto;transform-origin:0 0}
.dot{width:26px;height:26px;margin:-13px 0 0 -13px;display:grid;place-items:center}
.dot{z-index:1}
.dot i{display:block;width:9px;height:9px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 2.5px var(--c),0 1px 3px rgba(0,0,0,.25)}
.dot .dl{display:none;position:absolute;left:21px;top:50%;transform:translateY(-50%);font-size:11.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;pointer-events:none;text-shadow:0 0 2px var(--land),0 0 3px var(--land),0 0 4px var(--land)}
#ov.named .dot .dl{display:block}
#ov .dot.nl .dl{display:none!important}
.dot.off i{width:7px;height:7px;opacity:.5;box-shadow:0 0 0 2px var(--c)}
.dot.fav i{width:16px;height:16px;background:var(--gold);display:grid;place-items:center;color:#fff}
.dot.fav i svg{width:11px;height:11px}
.dot.seen i{width:14px;height:14px;background:var(--surface);color:var(--ink-3);display:grid;place-items:center;box-shadow:0 0 0 1.5px var(--ink-3)}
.dot.seen i svg{width:10px;height:10px;stroke-width:3}
.pin{width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface),0 1px 4px rgba(0,0,0,.35);pointer-events:none;z-index:2;font-variant-numeric:tabular-nums}
.pin.nn{width:13px;height:13px;margin:-6.5px 0 0 -6.5px}
.cg{position:relative}
.cg .num{position:absolute;right:-5px;bottom:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ink);color:var(--surface);font-size:10.5px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface);font-variant-numeric:tabular-nums}
.bub{z-index:2;pointer-events:auto;display:flex;align-items:center;gap:6px;max-width:172px;padding:5px 9px 5px 5px;background:var(--surface);color:var(--ink);border-radius:12px;box-shadow:var(--shadow-sm);border:1px solid var(--line);text-align:left;white-space:nowrap}
.bub::after{content:"";position:absolute;width:10px;height:10px;background:var(--surface);border:1px solid var(--line);transform:rotate(45deg)}
.bub.t-n::after{left:calc(var(--tx,50%) - 5px);bottom:-6px;border-top:0;border-left:0}
.bub.t-s::after{left:calc(var(--tx,50%) - 5px);top:-6px;border-bottom:0;border-right:0}
.bub.t-e::after{left:-6px;top:calc(50% - 5px);border-top:0;border-right:0}
.bub.t-w::after{right:-6px;top:calc(50% - 5px);border-bottom:0;border-left:0}
.bub.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.bub.sel::after{border-color:var(--accent)}
.bub.dim{opacity:.62}
.bub.mini{padding:4px 8px 4px 4px;gap:5px}
.bub.mini .bn,.bub.mini .x{display:none}
.bub.mini .cg{width:22px;height:22px}
.bub.mini .cg svg{width:14px;height:14px}
.cg{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.cg svg{width:16px;height:16px;stroke-width:2}
.bt{display:flex;flex-direction:column;min-width:0}
.bn{font-weight:600;font-size:13px;line-height:1.15;overflow:hidden;text-overflow:ellipsis}
.bd{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums;line-height:1.2}
.bd .lit{color:var(--accent);font-weight:600}
.bd .soon{color:var(--warn);font-weight:600}
.arr{width:11px;height:11px;transform:rotate(var(--r,0deg));fill:currentColor;stroke:none;flex:none}
.bub .bfav{position:absolute;top:-7px;right:-7px;width:17px;height:17px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
.bub .bfav svg{width:10px;height:10px}
.edge{z-index:2;pointer-events:auto;display:flex;align-items:center;gap:5px;height:34px;padding:0 11px 0 5px;border-radius:17px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);border:1px solid var(--line);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.edge .cg{width:22px;height:22px}.edge .cg svg{width:13px;height:13px}
.edge .arr{width:13px;height:13px;color:var(--accent)}
.edge .en{max-width:84px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.edge .ed{color:var(--ink-2);font-weight:500}
.edge.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),var(--shadow-sm)}
.me{width:22px;height:22px;margin:-11px 0 0 -11px;pointer-events:none}
.me i{position:absolute;inset:3px;border-radius:50%;background:var(--you);box-shadow:0 0 0 3px #fff,0 2px 6px rgba(0,0,0,.35)}
.me.manual i{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--you-soft),0 2px 6px rgba(0,0,0,.35)}
.me b{position:absolute;inset:-14px;border-radius:50%;background:var(--you-soft);animation:pulse 2.4s ease-out infinite}
.me.manual b{display:none}
@keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.acc{border-radius:50%;background:var(--you-soft);border:1px solid var(--you);opacity:.6;pointer-events:none}
.hotel{pointer-events:auto;display:flex;align-items:center;gap:4px;height:26px;padding:0 9px 0 6px;margin:-13px 0 0 -13px;border-radius:8px;background:var(--ink);color:var(--surface);font-size:12px;font-weight:600;box-shadow:var(--shadow-sm);white-space:nowrap}
.hotel svg{width:15px;height:15px}

/* ---- top bar + filter chips ---- */
#top{position:absolute;top:10px;left:0;right:0;z-index:700;display:flex;align-items:center;gap:6px;padding-left:var(--gut-l);padding-right:var(--gut-r);pointer-events:none}
#top>*{pointer-events:auto}
#top>#chips{pointer-events:none}
.chip{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.brand{flex:none;height:44px;padding:0 9px;border-radius:13px;background:var(--accent);color:#fff;font-family:var(--font-display);font-size:16px;line-height:44px;letter-spacing:.06em;box-shadow:var(--shadow-sm)}
.ctx{display:flex;gap:6px;padding:8px 8px 0}
.ctxb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:46px;padding:0 10px 0 7px;border-radius:14px;background:var(--surface-2);text-align:left}
.ctxb .lc-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--you-soft);color:var(--you);flex:none}
.ctxb .lc-ic svg{width:16px;height:16px}
.ctxb.live .lc-ic{background:var(--you);color:#fff}
.ctxb.stale .lc-k{color:var(--warn)}
a.qb{text-decoration:none;color:var(--ink)}
.ctxb .lc-t{display:flex;flex-direction:column;min-width:0;line-height:1.15;flex:1}
.ctxb .lc-k{font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctxb .lc-v{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-e{width:16px;height:16px;color:var(--ink-3);transform:rotate(180deg);flex:none}
#menuBtn{width:44px;justify-content:center;padding:0;position:relative}
#menuBtn{flex:none}
#menuBtn .badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:#231a00;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
#chips{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:6px 0 10px;margin:-6px 0 -10px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6px,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 6px,#000 calc(100% - 22px),transparent 100%)}
#chips::-webkit-scrollbar{display:none}
.chips-in{display:flex;gap:6px;width:max-content;padding:0 22px 0 4px}
.fchip{pointer-events:auto;display:flex;align-items:center;gap:5px;height:40px;padding:0 13px 0 10px;border-radius:17px;background:var(--surface);color:var(--ink-2);border:1px solid var(--line);box-shadow:var(--shadow-sm);font-size:13.5px;font-weight:600;white-space:nowrap}
.fchip svg{width:15px;height:15px}
.fchip.all{padding:0 13px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* floating map button */
#fabs{position:absolute;right:var(--gut-r);z-index:650;display:flex;flex-direction:column;gap:8px;transition:bottom .25s,opacity .2s}
#fabs.off{opacity:0;pointer-events:none}
.fab{width:44px;height:44px;border-radius:13px;background:var(--surface);box-shadow:var(--shadow-sm);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}

/* ---- bottom panel ---- */
#panel{position:absolute;left:0;right:0;bottom:10px;z-index:640;padding-left:var(--gut-l);padding-right:var(--gut-r);pointer-events:none;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
#panel.hide{transform:translateY(calc(100% + 20px));opacity:0}
.card{pointer-events:auto;max-width:520px;margin:0 auto;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.bands{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;background:var(--surface-2);margin:6px 8px 0;border-radius:14px}
.band{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px 6px;border-radius:10px;color:var(--ink-2)}
.band .bl{display:flex;align-items:center;gap:5px;font-weight:600;font-size:14.5px}
.band .bl svg{width:17px;height:17px}
.band .br{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.band[aria-selected="true"]{background:var(--ink);color:var(--surface);box-shadow:var(--shadow-sm)}
.band[aria-selected="true"] .br{color:var(--surface);opacity:.78}
.sumbar{display:flex;align-items:center;gap:6px;padding:2px 10px 2px 0}
#sumRow{flex:1;min-width:0;display:block;padding:9px 4px 11px 14px;text-align:left}
#sumRow .s1{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sumRow .s2{display:block;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{position:relative;display:flex;align-items:center;gap:6px;height:46px;padding:0 10px 0 11px;border-radius:14px;background:var(--surface-2);font-size:14px;font-weight:600;color:var(--ink);flex:none;white-space:nowrap}
.when svg{width:17px;height:17px;color:var(--ink-2)}
.when .lc-e{width:14px;height:14px}
.when.on svg{color:var(--accent)}
.when select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
.when.on{background:var(--accent-soft);color:var(--accent)}
#sumChev{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.strollb{flex:none;display:flex;align-items:center;gap:5px;height:34px;padding:0 12px 0 10px;border-radius:17px;background:var(--surface-2);color:var(--ink);font-size:13.5px;font-weight:600;text-decoration:none;white-space:nowrap}
.strollb svg{width:16px;height:16px}
.strollb.nx{background:var(--accent);color:var(--accent-ink);padding:0 15px 0 12px}
.strollb[hidden]{display:none}
.row.done .rn{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--ink-3)}
.row.done .rn,.row.done .rd{opacity:.6}
.row .num.ok{background:var(--ok)}
.row.next{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.rtag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:4px}
.foot{display:flex;gap:8px;padding:10px 14px 12px;border-top:1px solid var(--line)}
.foot a,.foot button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:40px;border-radius:12px;background:var(--surface-2);font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none}
.foot svg{width:16px;height:16px}
.foot a{flex:1.6;white-space:nowrap}
.bub.done{opacity:.55}
.pin.done{background:var(--ink-3)}
#sumChev svg{transition:transform .25s}
#panel.open #sumChev svg{transform:rotate(180deg)}
#list{max-height:0;overflow:auto;transition:max-height .3s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
#panel.open #list{max-height:min(46vh,420px)}
.row{display:flex;align-items:center;gap:11px;width:100%;padding:10px 14px;border-top:1px solid var(--line);text-align:left}
.row .cg{width:32px;height:32px}.row .cg svg{width:18px;height:18px}
.row .rt{flex:1;min-width:0}
.row .rn{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rm{display:block;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rd{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-variant-numeric:tabular-nums;flex:none}
.row .rd b{font-weight:600;font-size:14px;display:flex;align-items:center;gap:3px}
.row .rd b .arr{width:12px;height:12px;color:var(--accent)}
.row .rd span{font-size:11.5px;color:var(--ink-3)}
.row.dim .rn,.row.dim .rd{opacity:.7}
.more{display:block;width:100%;padding:12px 14px;border-top:1px solid var(--line);color:var(--accent);font-weight:600;font-size:14px;text-align:center}
.empty{padding:2px 14px 14px;color:var(--ink-2);font-size:14px;display:flex;flex-wrap:wrap;gap:8px}
.empty button{height:36px;padding:0 12px;border-radius:18px;background:var(--surface-2);color:var(--accent);font-weight:600}
.oc{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:8px;white-space:nowrap}
.oc.open{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.oc.closing,.oc.soft,.oc.opening{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.oc.closed{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.oc.event{color:var(--accent);background:var(--accent-soft)}

/* ---- sheets ---- */
/* A sheet is a fixed box over the app (below the top bar); its card sits at the bottom of the box and slides by its own height. */
.sheet{position:absolute;left:0;right:0;top:64px;bottom:0;z-index:800;display:flex;flex-direction:column;justify-content:flex-end;padding:0 var(--gut-r) 10px var(--gut-l);pointer-events:none;visibility:hidden;transition:visibility 0s .3s}
.sheet.on{visibility:visible;transition:none}
.sheet>.card{width:100%;max-height:100%;min-height:0;display:flex;flex-direction:column;transform:translateY(calc(100% + 24px));transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.on>.card{transform:none}
#placeSheet>.card{max-height:max(72%, 360px)}
.sheet>.card:focus{outline:none}
.sheet.dock{top:10px;bottom:auto;justify-content:flex-start;padding-bottom:0}
.sheet.dock>.card{max-height:min(62vh,520px,calc(var(--vvh,100vh) - 24px))}
.sheet.dock:not(.on)>.card{transform:translateY(calc(-100% - 24px))}
.grab{flex:none;height:20px;display:grid;place-items:center;cursor:grab}
.grab::before{content:"";width:38px;height:5px;border-radius:3px;background:var(--line)}
.sh-scroll{overflow:auto;overscroll-behavior:contain;padding:0 16px 14px;-webkit-overflow-scrolling:touch}
.sh-head{display:flex;align-items:flex-start;gap:10px}
.sh-head .x{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;margin:-2px -4px 0 auto}
.kicker{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);flex-wrap:wrap}
.kicker .cg{width:24px;height:24px}.kicker .cg svg{width:14px;height:14px}
h2{margin:8px 0 0;font-size:24px;line-height:1.15;font-weight:700;text-wrap:balance;letter-spacing:-.005em}
.ja{display:flex;align-items:center;gap:6px;margin-top:4px;font-family:var(--font-ja);font-size:16px;color:var(--ink-2);flex-wrap:wrap}
.ja .jt{font-family:var(--font-ja)}
.ja .taxi{display:flex;align-items:center;gap:5px;height:30px;padding:0 10px 0 8px;border-radius:15px;background:var(--surface-2);font-family:var(--font-ui);font-size:12.5px;font-weight:600;color:var(--ink)}
.ja .taxi svg{width:16px;height:16px}
.ja .cp{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.ja .cp svg{width:16px;height:16px}
.dist{display:flex;align-items:center;gap:12px;margin:14px 0 0;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.dist .compass{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;position:relative;flex:none}
.dist .compass::before{content:"N";position:absolute;top:1px;font-size:8.5px;font-weight:700;color:var(--ink-3)}
.dist .compass .arr{width:20px;height:20px;color:var(--accent)}
.dist .dv{font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.05}
.dist .dv span{font-size:15px;color:var(--ink-2);font-weight:600}
.dist .dm{font-size:13px;color:var(--ink-2)}
.dist .dm .jw{font-family:var(--font-ja);color:var(--ink-3);margin-left:4px}
.dist .stn{display:flex;gap:6px;align-items:flex-start;margin-top:5px;font-size:12.5px;color:var(--ink-2);line-height:1.35}
.dist .stn svg{width:14px;height:14px;margin-top:1px;flex:none}
.dist .stn b{color:var(--ink);font-weight:600}
.marks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.mb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border-radius:12px;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--ink-2);min-height:52px}
.mb svg{width:19px;height:19px}
.mb[aria-pressed="true"].fv{background:color-mix(in srgb,var(--gold) 20%,var(--surface));color:var(--gold)}
.mb[aria-pressed="true"].fv svg{fill:currentColor}
.mb[aria-pressed="true"].sn{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}
.evbox{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;padding:10px 12px;border-radius:14px;background:var(--accent-soft)}
.evbox svg{width:18px;height:18px;color:var(--accent);margin-top:1px}
.evbox b{display:block;font-size:14px;color:var(--ink)}
.evbox span{display:block;font-size:13px;color:var(--ink-2)}
.blurb{margin:12px 0 0;font-size:15px;line-height:1.5;color:var(--ink);max-width:62ch}
.tip{display:flex;gap:8px;margin:10px 0 0;font-size:14px;line-height:1.45;color:var(--ink-2)}
.tip svg{width:16px;height:16px;margin-top:2px;color:var(--gold)}
.meta{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:7px;font-size:14px}
.meta>div{display:flex;gap:10px;align-items:baseline}
.meta .mk2{flex:none;width:66px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.meta .ad{font-family:var(--font-ja);flex:1;min-width:0}
.meta .cp{width:30px;height:30px;margin:-6px -4px -6px 0;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);flex:none}
.meta .cp svg{width:16px;height:16px}
.acts{display:flex;flex-direction:column;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.gorow{display:flex;gap:8px}
.go{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;text-decoration:none}
.go svg{width:18px;height:18px}
.go2{display:flex;align-items:center;justify-content:center;height:50px;padding:0 15px;border-radius:14px;background:var(--surface-2);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}

/* location + menu sheets */
.sec{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 6px}
.field{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);margin-top:12px}
.field input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:0;-webkit-user-select:text;user-select:text}
.field svg{color:var(--ink-3)}
.qrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.qb{display:flex;align-items:center;gap:6px;height:40px;padding:0 13px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.qb svg{width:16px;height:16px;color:var(--ink-2)}
.qb.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.qb.pri svg{color:var(--surface)}
.res{margin-top:4px}
.res button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 4px;border-bottom:1px solid var(--line);text-align:left}
.res .rk{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);flex:none;color:var(--ink-2)}
.res .rk svg{width:16px;height:16px}
.res .rx{flex:1;min-width:0}
.res .rx b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .rx span{font-size:12px;color:var(--ink-2)}
.res .rj{font-family:var(--font-ja);font-size:13px;color:var(--ink-3)}
.callout{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13.5px;color:var(--ink-2);display:flex;gap:10px;align-items:center}
.callout button,.callout a{flex:none;display:grid;place-items:center;height:34px;padding:0 12px;border-radius:17px;background:var(--ink);color:var(--surface);font-weight:600;font-size:13px;text-decoration:none}
.callout.live{background:color-mix(in srgb,var(--you) 12%,var(--surface));color:var(--ink)}
.callout.live a{background:var(--you);color:#fff;padding:0 16px}
.note{font-size:13px;line-height:1.45;color:var(--ink-2);margin-top:12px}
.note b{color:var(--ink)}
details.note summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.note ol{margin:8px 0 0;padding-left:20px}
details.note code{font-size:12px;word-break:break-all;background:var(--surface-2);padding:1px 4px;border-radius:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2)}
.seg button{height:38px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button svg{width:16px;height:16px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.mlist{margin:0;padding:0;list-style:none}
.mlist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.mlist li .cg{width:28px;height:28px}.mlist li .cg svg{width:15px;height:15px}
.mlist li>button.mt{flex:1;min-width:0;text-align:left}
.mlist li .mn{font-weight:600;font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlist li .md{font-size:12px;color:var(--ink-2)}
.mlist li .rs{font-size:13px;font-weight:600;color:var(--accent);padding:8px 8px;flex:none}
.muted{color:var(--ink-3);font-size:13.5px;padding:4px 0}
.credits{font-size:11.5px;line-height:1.5;color:var(--ink-3);margin-top:18px}
.credits a{color:var(--ink-2)}

/* scrim, pick mode, toast, taxi card */
#scrim{position:absolute;inset:0;z-index:780;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#pickPin{position:absolute;left:50%;top:50%;z-index:660;width:40px;height:40px;margin:-38px 0 0 -20px;pointer-events:none;display:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
#pickPin svg{width:40px;height:40px;fill:var(--you);stroke:#fff;stroke-width:1.5}
#pickBar{position:absolute;left:0;right:0;bottom:10px;z-index:700;padding-left:var(--gut-l);padding-right:var(--gut-r);display:none}
#pickBar .card{padding:12px;display:flex;flex-direction:column;gap:10px}
#pickBar p{margin:0 4px;font-size:14px;color:var(--ink-2)}
#pickBar .pb{display:flex;gap:8px}
#pickBar .pb button{flex:1;height:48px;border-radius:13px;font-weight:700}
#pickBar .ok{background:var(--you);color:#fff}
#pickBar .no{background:var(--surface-2)}
#app.picking #pickPin,#app.picking #pickBar{display:block}
#app.picking #panel,#app.picking #fabs,#app.picking #chips{opacity:0;pointer-events:none}
#app.picking #chips .fchip{pointer-events:none}
#app.picking #ov,#app.picking #ov *{pointer-events:none}
#app.picking #ov .bub,#app.picking #ov .edge,#app.picking #ov .pin,#app.picking #ov .hotel{display:none!important}
#app.picking #ov .dot .dl{display:block}
#toast{position:absolute;left:50%;bottom:var(--toast-b,190px);z-index:900;transform:translate(-50%,14px);opacity:0;pointer-events:none;transition:.25s;display:flex;align-items:center;gap:14px;width:max-content;max-width:calc(100% - 32px);padding:10px 14px;border-radius:14px;background:var(--ink);color:var(--surface);font-size:14px;box-shadow:var(--shadow)}
#toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#toast span{min-width:0}
#toast button{color:var(--gold);font-weight:700;flex:none;padding:4px 0}
#bigja{position:absolute;inset:0;z-index:1000;background:var(--surface);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px));text-align:center}
#bigja.on{display:flex}
#bigja:focus{outline:none}
#bigja .bk{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
#bigja .bj{font-family:var(--font-ja);font-weight:700;font-size:clamp(40px,13vw,112px);line-height:1.15;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
#bigja .bm{font-family:var(--font-ja);font-weight:700;font-size:clamp(22px,6.4vw,42px);color:var(--ink)}
#bigja .ba{font-family:var(--font-ja);font-size:17px;color:var(--ink-2);max-width:30ch}
#bigja .be{font-size:15px;color:var(--ink-2);margin-top:6px}
#bigja .bh{font-size:12.5px;color:var(--ink-3);margin-top:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (min-width:760px){
  #panel,.sheet{padding-left:max(20px,env(safe-area-inset-left,0px));right:auto;width:440px}
  .card{margin:0}
}
</style>
