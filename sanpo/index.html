  var ga = document.getElementById('gpsAgain'); if (ga) ga.onclick = function(){ closeSheets(); resumeGps(true); toast('Following your GPS again'); };
  var cs = document.getElementById('scCopy'); if (cs) cs.onclick = function(){ copyText(ARTIFACT_URL + '#at', document.getElementById('scLink')); };
  document.querySelectorAll('#locBody [data-arr]').forEach(function(b){ b.onclick = function(){ var p = PBY[b.getAttribute('data-arr')]; closeSheets(); arriveAt(p); }; });
  var sh = document.getElementById('saveHotel'); if (sh) sh.onclick = function(){ S.hotels[S.city] = { lat:S.loc.lat, lng:S.loc.lng, label:pinLabel(S.loc) }; persist(); toast(c.name + ' hotel saved'); openLoc(); queueLayout(); };
  document.getElementById('jumpCity').onclick = function(){ var hh = hotelFor(other), q = CITIES[other].quick[0];
    stopGps(); closeSheets(); if (hh) setLoc({ lat:hh.lat, lng:hh.lng, src:'hotel', label:'At your hotel' }); else setLoc({ lat:q.lat, lng:q.lng, src:'station', label:'At ' + q.n }); };
  var inp = document.getElementById('locQ');
  inp.oninput = function(){ renderResults(inp.value); };
  inp.onfocus = function(){ var sheet = document.getElementById('locSheet'); if (!sheet.classList.contains('dock')){ sheet.classList.add('dock'); setTimeout(function(){ placeFabs(); queueLayout(); }, 50); } };
  inp.onkeydown = function(e){ if (e.key === 'Enter'){ var first = document.querySelector('#locRes button[data-i]'); if (first) first.click(); } };
  inp.addEventListener('paste', function(){ setTimeout(function(){ renderResults(inp.value); }, 0); });
  renderResults('');
  openSheet('locSheet');
}
function renderResults(q){
  var box = document.getElementById('locRes'); if (!box) return; var nq = norm(q), res = [];
  var pt = parseCoords(q);
  if (pt) res.push({ k:'pt', city:cityOf(pt), n:pt.lat.toFixed(5) + ', ' + pt.lng.toFixed(5), ja:'', lat:pt.lat, lng:pt.lng });
  if (!nq && !pt){ box.innerHTML = ''; return; }
  if (nq.length >= 2 || /[^\x00-\x7f]/.test(q)){
    res = res.concat(searchIndex().filter(function(x){ return x.nn.indexOf(nq) >= 0 || x.nj.indexOf(nq) >= 0; })
      .sort(function(a, b){ var sa = a.nn.indexOf(nq) === 0 ? 0 : 1, sb = b.nn.indexOf(nq) === 0 ? 0 : 1; return sa - sb || (a.city === S.city ? 0 : 1) - (b.city === S.city ? 0 : 1) || b.w - a.w; }).slice(0, 8));
  }
  box.innerHTML = res.length ? res.map(function(x, i){
    var ic = x.k === 'pt' ? 'i-pin' : x.cat ? (x.sub && SUBS[x.sub] ? SUBS[x.sub].i : CATS[x.cat].i) : 'i-station';
    var sub = x.k === 'pt' ? 'Use this point · ' + CITIES[x.city].name : CITIES[x.city].name + (x.city === S.city && S.loc ? ' · ' + fmtD(dist(S.loc, x)) + ' away' : '');
    return '<button data-i="' + i + '"><span class="rk"' + (x.cat ? ' style="background:' + catVar(x.cat) + ';color:#fff"' : '') + '>' + icon(ic) + '</span><span class="rx"><b>' + esc(x.n) + '</b><span>' + esc(sub) + '</span></span><span class="rj" lang="ja">' + esc(x.ja) + '</span></button>'; }).join('')
    : '<p class="muted">No match. Try the station name in English or Japanese.</p>';
  box.querySelectorAll('button[data-i]').forEach(function(b){ b.onclick = function(){ var x = res[+b.getAttribute('data-i')]; stopGps(); closeSheets();
    setLoc({ lat:x.lat, lng:x.lng, src:x.k === 'stn' ? 'station' : x.k === 'pt' ? 'pin' : 'place', label:x.k === 'pt' ? nearestLabel(x) : 'At ' + x.n }); }; });
}
document.getElementById('locChip').addEventListener('click', openLoc);

/* pick on map */
var pickHotel = false;
function startPick(forHotel){
  pickHotel = !!forHotel; closeSheets();
  document.getElementById('pickHint').textContent = pickHotel ? 'Drag the map so the pin sits on your hotel.' : 'Drag the map so the pin sits where you are.';
  document.getElementById('pickOk').textContent = pickHotel ? 'Save my hotel here' : 'Set my location here';
  document.getElementById('app').classList.add('picking'); vpCache = null;
  var target = pickHotel ? hotelFor(S.city) || S.loc : S.loc; if (target){ map.setView([target.lat, target.lng], Math.max(map.getZoom(), 15.5), { animate:false }); } updatePickHint();
}
var pickRaf = 0;
map.on('move', function(){ if (!document.getElementById('app').classList.contains('picking') || pickRaf) return; pickRaf = requestAnimationFrame(function(){ pickRaf = 0; updatePickHint(); }); });
function updatePickHint(){ var n = nearestLabel(map.getCenter()); document.getElementById('pickHint').textContent = (pickHotel ? 'Hotel pin: ' : 'Pin: ') + (n === 'Dropped pin' ? 'drag the map to place it' : n.replace(/^At /, 'at ').replace(/^Near /, 'near ')); }
function endPick(){ document.getElementById('app').classList.remove('picking'); pickHotel = false; placeFabs(); queueLayout(); }
document.getElementById('pickNo').addEventListener('click', endPick);
document.getElementById('pickOk').addEventListener('click', function(){
  var c = map.getCenter(), forHotel = pickHotel; endPick();
  if (forHotel){ var key = cityOf(c); S.hotels[key] = { lat:c.lat, lng:c.lng, label:pinLabel(c) }; persist(); toast(CITIES[key].name + ' hotel saved'); queueLayout(); return; }
  stopGps(); setLoc({ lat:c.lat, lng:c.lng, src:'pin', label:nearestLabel(c) }, { fit:true });
});

/* ---------------- menu ---------------- */
function renderMenu(){
  var fav = [], seen = [], hid = [];
  PLACES.forEach(function(p){ var m = mark(p.id); if (m.fav) fav.push(p); if (m.seen) seen.push(p); if (m.hidden) hid.push(p); });
  function li(p, act){ var dd = p.city === S.city && S.loc ? fmtD(dist(S.loc, p)) : CITIES[p.city].name;
    return '<li style="--c:' + catVar(p.cat) + '"><span class="cg">' + icon(catOf(p).i) + '</span><button class="mt" data-go="' + p.id + '"><span class="mn">' + esc(p.n) + '</span><span class="md">' + esc(p.area) + ' · ' + dd + '</span></button>' + (act ? '<button class="rs" data-' + act + '="' + p.id + '">' + (act === 'unhide' ? 'Show again' : 'Unmark') + '</button>' : '') + '</li>'; }
  var h = hotelFor(S.city);
  var html = '<div class="sh-head"><h2 style="margin:0">Your trip</h2><button class="x" id="menuX" aria-label="Close">' + icon('i-close') + '</button></div>' +
    '<div class="sec">Saved · ' + fav.length + '</div>' + (fav.length ? '<ul class="mlist">' + fav.map(function(p){ return li(p); }).join('') + '</ul>' : '<p class="muted">Tap Save on a place to keep it here. Saved places get a gold star on the map, rank higher, and have their own Saved filter.</p>') +
    '<div class="sec">Visited · ' + seen.length + '</div>' + (seen.length ? '<ul class="mlist">' + seen.map(function(p){ return li(p, 'unseen'); }).join('') + '</ul>' : '<p class="muted">Places you mark as visited stop showing up as suggestions.</p>') +
    '<div class="sec">Hidden · ' + hid.length + '</div>' + (hid.length ? '<ul class="mlist">' + hid.map(function(p){ return li(p, 'unhide'); }).join('') + '</ul>' : '<p class="muted">Nothing hidden.</p>') +
    '<div class="sec">Directions open in</div><div class="seg"><button data-app="apple" aria-pressed="' + (S.app === 'apple') + '">Apple Maps</button><button data-app="google" aria-pressed="' + (S.app === 'google') + '">Google Maps</button></div>' +
    '<div class="sec">' + CITIES[S.city].name + ' hotel</div><p class="muted" style="margin:0">' + (h ? esc(h.label || 'Saved spot') : 'Not set yet. Save it once and it’s a one-tap way back.') + '</p>' +
    '<div class="qrow" style="margin-top:8px">' + (S.loc && cityOf(S.loc) === S.city && S.loc.src !== 'hotel' ? '<button class="qb" id="hotelHere">' + icon('i-bed') + 'Use where I am</button>' : '') + '<button class="qb" id="setHotel">' + icon('i-pin') + (h ? 'Move pin on map' : 'Pick on map') + '</button></div>' +
    (IS_WEB && !window.navigator.standalone ? '<p class="note"><b>Tip:</b> in Safari, tap Share → Add to Home Screen to open Sanpo full screen, like an app.</p>' : '') +
    '<p class="note">' + (dbCol && !dbReadOnly ? 'Saved, visited and hidden places sync with anyone you share this page with.' : dbCol ? 'You see what others saved here; your own changes stay on this device.' : 'Saved, visited and hidden places are kept on this device.') + '</p>' +
    '<p class="credits">Places picked for this trip. Hours and events were checked ' + CHECKED + ' and can change, so confirm before a long trip. Map data: MLIT National Land Numerical Information (administrative areas, N03, CC BY 4.0, processed); Tokyo rail lines and stations from <a href="https://github.com/nagix/mini-tokyo-3d" target="_blank" rel="noopener">Mini Tokyo 3D</a>; Kyoto stations from ekidata via open-data-jp-railway-stations. Place pins from Wikipedia and GSI address search (出典：国土地理院). Parks, hills and some river sections are approximate.</p>';
  document.getElementById('menuBody').innerHTML = html;
  document.getElementById('menuX').onclick = closeSheets;
  document.querySelectorAll('#menuBody [data-go]').forEach(function(b){ b.onclick = function(){ var p = PBY[b.getAttribute('data-go')];
    if (p.city !== S.city){ var hh = hotelFor(p.city), q = CITIES[p.city].quick[0]; stopGps(); setLoc(hh ? { lat:hh.lat, lng:hh.lng, src:'hotel', label:'At your hotel' } : { lat:q.lat, lng:q.lng, src:'station', label:'At ' + q.n }, { fit:false }); }
    closeSheets(); setTimeout(function(){ select(p.id, true); }, 60); }; });
  document.querySelectorAll('#menuBody [data-unseen]').forEach(function(b){ b.onclick = function(){ toggleMark(b.getAttribute('data-unseen'), 'seen'); }; });
  document.querySelectorAll('#menuBody [data-unhide]').forEach(function(b){ b.onclick = function(){ toggleMark(b.getAttribute('data-unhide'), 'hidden'); }; });
  document.querySelectorAll('#menuBody [data-app]').forEach(function(b){ b.onclick = function(){ S.app = b.getAttribute('data-app'); persist(); renderMenu(); }; });
  var hh2 = document.getElementById('hotelHere'); if (hh2) hh2.onclick = function(){ S.hotels[S.city] = { lat:S.loc.lat, lng:S.loc.lng, label:pinLabel(S.loc) }; persist(); toast(CITIES[S.city].name + ' hotel saved'); renderMenu(); queueLayout(); };
  document.getElementById('setHotel').onclick = function(){ startPick(true); };
}
document.getElementById('menuBtn').addEventListener('click', function(){ renderMenu(); openSheet('menuSheet'); });

/* ---------------- toast ---------------- */
var toastTimer = 0, toastFn = null;
function toast(msg, action){
  var t = document.getElementById('toast'), u = document.getElementById('toastU');
  document.getElementById('toastT').textContent = msg; toastFn = action ? action.fn : null;
  u.hidden = !action; if (action) u.textContent = action.l;
  t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('on'); toastFn = null; }, action ? 5000 : 2400);
}
document.getElementById('toastU').addEventListener('click', function(){ var fn = toastFn; toastFn = null; document.getElementById('toast').classList.remove('on'); if (fn) fn(); });

/* ---------------- theme ---------------- */
function onTheme(){ readTheme(); styleCity(); drawRoute(); redrawLabels(); var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', T.land); }
if (window.matchMedia){ var mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', onTheme); else if (mq.addListener) mq.addListener(onTheme); }
new MutationObserver(onTheme).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme','class'] });
window.addEventListener('resize', function(){ placeFabs(); queueLayout(); });
if (window.ResizeObserver){ var ro = new ResizeObserver(function(){ placeFabs(); queueLayout(); }); ro.observe(document.querySelector('#panel .card')); document.querySelectorAll('.sheet .card').forEach(function(c){ ro.observe(c); }); }

/* ---------------- boot ---------------- */
readTheme(); renderChips(); renderWhen();
var start = hashLoc() || (S.loc && inJapan(S.loc) ? S.loc : null);
if (!start){ var hh = hotelFor('tokyo'), q0 = CITIES.tokyo.quick[0]; start = hh ? { lat:hh.lat, lng:hh.lng, src:'hotel', label:'At your hotel' } : { lat:q0.lat, lng:q0.lng, src:'station', label:'Near ' + q0.n }; }
if (start.src === 'gps'){ start = { lat:start.lat, lng:start.lng, src:'last', label:start.label || 'Last GPS fix', t:start.t }; }
if (!start.t) start.t = Date.now();
S.loc = start; map.setView([start.lat, start.lng], 15); setCity(cityOf(start)); buildOverlay();
compute(); renderPanel(); fillBubbles(); renderLocChip(); placeFabs();
fitView(true); redrawLabels();
persist(); tryGps(); initDb(); setTimeout(function(){ if (!checkPending() && !staleNudge()) lpTip(); }, 1500);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ redrawLabels(); Object.keys(EL).forEach(function(id){ EL[id].bw = 0; EL[id].mw = 0; EL[id].ew = 0; }); queueLayout(); });
if (window.__sanpoTest) window.__sanpoTest = { select:select, setLoc:setLoc, startStroll:startStroll, endStroll:endStroll, routeOrder:routeOrder, routeLen:routeLen, toggleMark:toggleMark, openInfo:openInfo, parseCoords:parseCoords, evalTime:evalTime, fmtH:fmtH, S:S, PBY:PBY, compute:compute, travelMin:travelMin, map:map, vpRect:vpRect, onMarksSnap:onMarksSnap, pushMark:pushMark, db:function(){ return { col:!!dbCol, ro:dbReadOnly, dirty:Object.keys(dbDirty), remote:dbRemote }; } };
setInterval(function(){
  if (document.visibilityState !== 'visible') return;
  renderWhen(); renderLocChip();
  if (sheetOpen) return;
  var ids = S.sugg.map(function(x){ return x.p.id; }).join(); compute();
  renderPanel(); if (S.sugg.map(function(x){ return x.p.id; }).join() !== ids) fillBubbles();
}, 3 * 60000);
})();
</script>
